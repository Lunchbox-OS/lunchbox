[package]
name = "shepherd-media-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared egui content-browsing UI for shepherd-media (Linux binary + Android app)"

[dependencies]
# Only the platform-agnostic core types (Item, PlatformInfo, resolve_source) are
# needed; no player/network. default-features=false keeps libmpv out of this
# crate's own feature set (the binaries opt in as they need).
shepherd-media-core = { path = "../shepherd-media-core", default-features = false }
# egui only: the `egui::Image` widget lives here. The image *loader*
# (egui_extras::install_image_loaders) is installed by each binary that uses
# this crate, so it isn't a dependency here.
egui = "0.34"

[package]
name = "lunchbox-media-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-agnostic core for lunchbox-media: library parsing, source resolution, session state, and protocol"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
url = { version = "2.5", features = ["serde"] }
percent-encoding = "2.3"
libmpv2 = { version = "5.0", optional = true }

[features]
default = ["libmpv"]
# Gate the libmpv-backed PlayerHandle implementation. Disabling this (e.g. when
# cross-compiling for Android) leaves the trait and protocol in place but
# omits the LibmpvPlayer struct, so a downstream platform binary can plug in
# its own implementation.
libmpv = ["dep:libmpv2"]

[dev-dependencies]
tempfile = { workspace = true }

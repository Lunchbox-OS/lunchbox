[package]
name = "shepherd-media"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Linux media-library launcher binary built on shepherd-media-core"

[[bin]]
name = "shepherd-media"
path = "src/main.rs"

[dependencies]
shepherd-media-core = { path = "../shepherd-media-core" }
shepherd-media-ui = { path = "../shepherd-media-ui" }
# `clap` feature exposes the shared `Quality` enum as a `--quality` value type.
shepherd-media-app = { path = "../shepherd-media-app", features = ["clap"] }
shepherd-util = { workspace = true }

clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
nix = { workspace = true }

eframe = { version = "0.34", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.34"
egui_extras = { version = "0.34", features = ["image"] }
glow = "0.17"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
gilrs = "0.11"
ureq = { version = "2.10", default-features = false, features = ["tls"] }
url = "2.5"
filetime = "0.2"

[package]
name = "shepherd-config-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Comment-preserving config document model for the web config editor"

# A leaf crate, deliberately left out of the workspace's `default-members` so a
# plain `cargo build` never pulls `wasm-bindgen` (or its derive machinery) into
# shepherdd and the launcher. Same reasoning as shepherd-wire-codegen.
#
# The document model in `doc.rs` is plain Rust with strings on its edges, so it
# builds and tests natively (`cargo test -p shepherd-config-wasm`); only the
# thin binding layer in `lib.rs` is wasm-gated. Everything crossing the JS
# boundary is a JSON string, which is why there is no serde-wasm-bindgen here.
#
# Build the browser artifact with:
#   wasm-pack build --target web crates/shepherd-config-wasm

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# Emit JSON Schema for the types the editor decodes back out of this module,
# from which `shepherd-webui/src/config/model/wasm-types.generated.ts` is
# rendered (see shepherd-wire-codegen). Off by default so schemars never
# reaches the browser artifact — the same arrangement shepherd-config uses.
schema = ["dep:schemars"]

[dependencies]
shepherd-config = { workspace = true }
schemars = { workspace = true, optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = "0.22"

# `wasm-bindgen` and the `uuid` randomness source are needed only for the
# browser build. Target-gating both keeps them out of native feature
# unification, so shepherdd and the launcher are unaffected. `uuid` reaches
# this crate through shepherd-util and refuses to build for wasm32 without a
# randomness source.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
uuid = { workspace = true, features = ["js"] }

# wasm-pack reads this; the workspace root owns `[profile.release]` for the
# native binaries, so size tuning for the browser artifact goes through
# wasm-opt rather than a profile override that Cargo would ignore here anyway.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]

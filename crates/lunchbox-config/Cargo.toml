[package]
name = "lunchbox-config"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Configuration parsing and validation for lunchboxd"

[[bin]]
name = "shepherd-validate-config"
path = "src/bin/shepherd-validate-config.rs"

[dependencies]
lunchbox-util = { workspace = true }
schemars = { workspace = true, optional = true }
lunchbox-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Emit JSON Schema for the `Raw*` config types, from which the web config
# editor's TypeScript mirrors are generated (see lunchbox-wire-codegen).
# Off by default so schemars never reaches lunchboxd or the launcher.
schema = ["dep:schemars"]

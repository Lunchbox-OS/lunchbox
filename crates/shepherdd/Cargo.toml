[package]
name = "shepherdd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The shepherdd background service: policy enforcement for child-focused computing"

[[bin]]
name = "shepherdd"
path = "src/main.rs"

[dependencies]
shepherd-util = { workspace = true }
shepherd-api = { workspace = true }
shepherd-bridge = { workspace = true }
shepherd-host-api = { workspace = true }
shepherd-config = { workspace = true }
shepherd-state-proto = { workspace = true }
shepherd-store = { workspace = true }
shepherd-core = { workspace = true }
shepherd-host-linux = { workspace = true }
shepherd-ipc = { workspace = true }
shepherd-http = { workspace = true }
shepherd-management = { workspace = true }
shepherd-ble = { workspace = true }
# Background media prefetch (issue #127). `default-features = false` on the
# core keeps libmpv out of the daemon — it reads libraries, it never plays them.
shepherd-media-app = { path = "../shepherd-media-app" }
shepherd-media-cache = { path = "../shepherd-media-cache" }
shepherd-media-core = { path = "../shepherd-media-core", default-features = false }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
notify = { workspace = true }
evdev = { workspace = true }
nix = { workspace = true, features = ["fs"] }
async-trait = "0.1"
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

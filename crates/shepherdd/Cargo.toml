[package]
name = "shepherdd"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The shepherdd background service: policy enforcement for child-focused computing"

[[bin]]
name = "shepherdd"
path = "src/main.rs"

[dependencies]
shepherd-util = { workspace = true }
shepherd-api = { workspace = true }
shepherd-host-api = { workspace = true }
shepherd-config = { workspace = true }
shepherd-store = { workspace = true }
shepherd-core = { workspace = true }
shepherd-host-linux = { workspace = true }
shepherd-ipc = { workspace = true }
shepherd-http = { workspace = true }
shepherd-management = { workspace = true }
shepherd-ble = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
anyhow = { workspace = true }
clap = { version = "4.5", features = ["derive", "env"] }
notify = { workspace = true }
evdev = { workspace = true }
async-trait = "0.1"
zbus = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

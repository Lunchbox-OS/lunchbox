[package]
name = "shepherd-media-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Platform-agnostic application layer for shepherd-media: persistent multi-library settings and management"

[dependencies]
serde = { workspace = true }
# Cache-file naming and the played-marker mtime. Both front-ends' video caches
# share these, so they live here rather than in either platform crate.
sha2 = "0.10"
filetime = "0.2"
toml = { workspace = true }
thiserror = { workspace = true }
# The `log` facade, not a subscriber: this crate only needs to report a failed
# resume-state write. The Linux binary's `tracing-subscriber` picks those
# records up through its `tracing-log` bridge, and the Android app's
# `android_logger` consumes them directly.
log = { workspace = true }
# Optional: lets the Linux binary reuse `Quality` directly as a
# `--quality` clap value. Kept optional so the Android cdylib, which does no
# CLI parsing, isn't forced to build clap.
clap = { workspace = true, optional = true }

[features]
# Derive `clap::ValueEnum` for the CLI-facing enums (Quality). Enabled by the
# `shepherd-media` Linux binary.
clap = ["dep:clap"]

[dev-dependencies]
tempfile = { workspace = true }

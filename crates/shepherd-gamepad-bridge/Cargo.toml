[package]
name = "shepherd-gamepad-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Sidecar that grabs gamepads and emits synthetic mouse + keyboard events (via /dev/uinput) for activities that ignore raw gamepad input"

[[bin]]
name = "shepherd-gamepad-bridge"
path = "src/main.rs"

[dependencies]
shepherd-bridge = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
nix = { workspace = true }
gilrs = "0.11"

[package]
name = "lunchbox-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol types for lunchboxd IPC: commands, events, versioning"

[dependencies]
lunchbox-util = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
schemars = { workspace = true, optional = true }
thiserror = { workspace = true }

[features]
# Emit JSON Schema for the wire types (see lunchbox-wire-codegen).
schema = ["dep:schemars", "lunchbox-util/schema"]

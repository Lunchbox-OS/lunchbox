[package]
name = "lunchbox-management"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Transport-agnostic management service trait shared by lunchbox-http and (planned) lunchbox-ble"

[dependencies]
schemars = { workspace = true, optional = true }
lunchbox-util = { workspace = true }
lunchbox-api = { workspace = true }
lunchbox-host-api = { workspace = true }
lunchbox-config = { workspace = true }
lunchbox-store = { workspace = true }
lunchbox-core = { workspace = true }
lunchbox-management-macros = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
async-trait = "0.1"
argon2 = { workspace = true }
rand = { workspace = true }
subtle = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
woothee = { workspace = true }

# Used only by the `rpc-codegen` binary — kept out of the library
# surface via `[[bin]]` in the parent workspace's build graph.
anyhow = { workspace = true }


[dev-dependencies]
lunchbox-ipc = { workspace = true }
tempfile = { workspace = true }

[features]
schema = ["dep:schemars", "lunchbox-api/schema"]

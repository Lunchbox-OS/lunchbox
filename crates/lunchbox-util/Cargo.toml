[package]
name = "lunchbox-util"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Shared utilities for lunchboxd: time, IDs, error types, rate limiting, gamepad navigation"

[dependencies]
schemars = { workspace = true, optional = true }
serde = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
serde_json = { workspace = true }

[features]
# Emit JSON Schema for the ID newtypes (see lunchbox-wire-codegen).
schema = ["dep:schemars"]

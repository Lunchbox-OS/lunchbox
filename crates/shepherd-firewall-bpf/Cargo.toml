[package]
name = "shepherd-firewall-bpf"
# Excluded from the workspace (see below), so it can't use version.workspace.
# Kept in sync with the repo-root VERSION file by `shepherd version set` and
# checked by `shepherd version check`. Don't hand-edit — bump via the tool.
version = "0.3.3"
edition = "2024"
license = "GPL-3.0"
publish = false
description = "cgroup_skb BPF program implementing the per-entry IP filter"

# Built separately from the main workspace via aya-build (see
# crates/shepherd-firewall-helper/build.rs). Not a workspace member because
# it targets bpfel-unknown-none with a nightly toolchain.

[dependencies]
aya-ebpf = "0.1.1"
network-types = "0.0.7"

[[bin]]
name = "shepherd-firewall-bpf"
path = "src/main.rs"

[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

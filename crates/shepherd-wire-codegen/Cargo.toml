[package]
name = "shepherd-wire-codegen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generates client mirrors of the shepherdd wire types from their JSON Schema"

# A leaf crate: nothing depends on it, and it is deliberately left out of the
# workspace's `default-members` so a plain `cargo build` never pulls schemars
# (or its derive machinery) into shepherdd and the launcher. Being *above*
# shepherd-ble in the graph is what lets it describe the BLE claim types too,
# which a generator living in shepherd-management could not reach.

[dependencies]
shepherd-api = { workspace = true, features = ["schema"] }
shepherd-management = { workspace = true, features = ["schema"] }
shepherd-ble = { workspace = true, features = ["schema"] }
schemars = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[[bin]]
name = "rpc-codegen"
path = "src/bin/rpc_codegen.rs"

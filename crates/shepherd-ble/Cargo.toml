[package]
name = "shepherd-ble"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Bluetooth LE management transport for shepherdd"

[dependencies]
schemars = { workspace = true, optional = true }
shepherd-util = { workspace = true }
shepherd-api = { workspace = true }
shepherd-management = { workspace = true }

bluer = { version = "0.17", features = ["bluetoothd"] }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
futures-util = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
async-trait = "0.1"
rand = "0.8"

[dev-dependencies]
tempfile = { workspace = true }

[features]
schema = ["dep:schemars", "shepherd-api/schema", "shepherd-management/schema"]

# F-Droid metadata for the lunchbox-media Android app.
#
# Consumed by `fdroid update` — see dist/fdroid/README.md for who runs it and
# when. Deliberately carries NO version fields: fdroidserver reads versionCode
# and versionName out of the APK, so the repo-root VERSION file stays the single
# source of truth.

Categories:
  - Multimedia

License: GPL-3.0-only
AuthorName: Albert Armea
WebSite: https://lunchbox-os.com
SourceCode: https://github.com/Lunchbox-OS/lunchbox
IssueTracker: https://github.com/Lunchbox-OS/lunchbox/issues

Name: Lunchbox Media
Summary: Curated media libraries for TVs and tablets

# YouTube sources are resolved with yt-dlp against YouTube itself: a proprietary
# service that cannot be self-hosted or swapped out. The app does not require it
# — local-directory and RSS libraries touch no such service — but it ships the
# capability, which is what the tag is for. Not applicable to the companion app,
# which speaks only Bluetooth LE to a device you own.
AntiFeatures:
  NonFreeNet:
    en-US: >-
      YouTube libraries stream from YouTube, a proprietary network service that
      cannot be self-hosted or replaced. Local-directory and RSS libraries do
      not use it.

Description: |-
  The Android build of lunchbox-media, the media player from Lunchbox —
  a child-friendly, parent-guided desktop environment for Wayland.

  Plays from libraries you define: a local directory, a YouTube channel or
  playlist, or an RSS feed. Playback is mpv; YouTube sources are resolved with
  yt-dlp. There is no recommendation feed, no autoplay into the unknown, and no
  account.

  Built for the couch: the library switcher, settings, and add-library form are
  all navigable with a TV remote, and adding a library needs no typing. Runs on
  phones, tablets, and Fire TV sticks (including 32-bit ones).

  Unlike the desktop build there is no Lunchbox daemon on Android, so
  this app owns its own library configuration and can be used standalone.

# Pin the release signing certificate. `fdroid update` refuses to publish an APK
# signed with anything else, and --delete-unknown removes it from the repo. This
# is the control that makes automated republishing of release assets safe: it is
# what stops an APK signed with a different key from reaching a family device as
# an in-place upgrade. Obtain with:
#     apksigner verify --print-certs FILE.apk | grep 'SHA-256 digest'
AllowedAPKSigningKeys:
  - 6959cc58afb8cde34da782a5b57a3028bf04141e8b106b80b69da7650f3b330f

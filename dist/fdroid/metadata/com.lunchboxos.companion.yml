IssueTracker: https://github.com/aarmea/lunchbox/issues

Name: Lunchbox Companion
Summary: Manage Lunchbox kiosk devices over Bluetooth LE

Description: |-
  The parent-facing admin app for Lunchbox, a child-friendly,
  parent-guided desktop environment for Wayland.

  Pairs with a device over Bluetooth LE using Numeric Comparison, claims it
  (single admin, trust-on-first-use), and then drives the full management RPC
  catalog over the bonded GATT link — no network, no account, no cloud.

  From the app you can:

  * see what is running now and end a session
  * grant, extend, or revoke time
  * manage activities, groups, and per-activity availability
  * set bedtime and availability windows
  * manage tokens and grouped time limits

  Requires a device running Lunchbox; it has no use on its own.


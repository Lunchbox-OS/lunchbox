# Run bluetoothd with experimental D-Bus interfaces enabled, for shepherd.
#
# shepherd pins the paired admin phone to the BR/EDR bearer via
# `org.bluez.Device1.PreferredBearer`, which upstream BlueZ flags
# experimental — so without `-E` the property does not exist on the bus and
# the pin cannot be applied.
#
# Why it matters: probing an auto-connect profile (a2dp, bap, hog, input)
# on a bonded phone makes BlueZ arm the kernel to connect that address
# whenever it advertises. shepherd is a GATT *peripheral*, so a link the
# device originates puts the device in the central role — and only a
# central may start encryption. The phone then cannot encrypt the link, and
# every read of an encrypted characteristic fails, on a link that never
# drops. Pinning the bearer to BR/EDR stops BlueZ arming the kernel, while
# leaving BR/EDR auto-connect (headphones, controllers) untouched.
#
# Without this drop-in shepherd still works: it logs how to enable the
# property and falls back to dropping such links after a delay.
#
# The empty ExecStart= is required to reset the unit's own value before
# replacing it. @BLUETOOTHD@ is substituted at install time from the
# running unit, so this tracks the distro's daemon path.
#
# See docs/INSTALL.md and
# docs/ai/history/2026-08-16 001 ble-connect-fails-after-long-session.md
[Service]
ExecStart=
ExecStart=@BLUETOOTHD@ -E

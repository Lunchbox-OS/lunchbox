name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl nodejs

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/shepherd deps install build

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: |
          . "$HOME/.cargo/env"
          ./scripts/shepherd build

  test:
    name: Test
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl nodejs

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/shepherd deps install build

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: |
          . "$HOME/.cargo/env"
          cargo test --all-targets

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl nodejs

      - uses: actions/checkout@v4

      - name: Install build and test dependencies
        run: |
          ./scripts/shepherd deps install build
          ./scripts/shepherd deps install run
          ./scripts/shepherd deps install test

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binaries (e2e harness execs them from target/debug)
        run: |
          . "$HOME/.cargo/env"
          ./scripts/shepherd build

      - name: Run e2e tests
        run: |
          . "$HOME/.cargo/env"
          cargo test -p shepherd-e2e -- --include-ignored --test-threads=1

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl nodejs

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/shepherd deps install build

      - name: Add clippy component
        run: |
          . "$HOME/.cargo/env"
          rustup component add clippy

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: |
          . "$HOME/.cargo/env"
          cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl nodejs

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/shepherd deps install build

      - name: Add rustfmt component
        run: |
          . "$HOME/.cargo/env"
          rustup component add rustfmt

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: |
          . "$HOME/.cargo/env"
          cargo fmt --all -- --check

  android-portability:
    name: Android portability (shepherd-media-core)
    runs-on: ubuntu-latest
    container:
      image: ubuntu:25.10
    steps:
      - name: Install git
        run: |
          apt-get update
          apt-get install -y git curl

      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: ./scripts/shepherd deps install build

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add aarch64-linux-android target
        run: |
          . "$HOME/.cargo/env"
          rustup target add aarch64-linux-android

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # We `cargo check` rather than `cargo build` because we only need to
      # verify that shepherd-media-core's dependencies and code compile for
      # the Android target — we don't need an Android linker. This job exists
      # to fail loudly if a Linux-specific dep gets added to the core.
      - name: Check shepherd-media-core for aarch64-linux-android
        run: |
          . "$HOME/.cargo/env"
          cargo check \
            --target aarch64-linux-android \
            --no-default-features \
            -p shepherd-media-core

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          apt-get update
          apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # SC1091: Not following sourced files (info only, safe to ignore)
          shellcheck -e SC1091 scripts/shepherd scripts/dev scripts/admin
          shellcheck -e SC1091 scripts/lib/*.sh
          shellcheck -e SC1091 run-dev

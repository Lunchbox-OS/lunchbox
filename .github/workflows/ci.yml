name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CI_IMAGE_NAME: git.armeafamily.com/albert/shepherd-launcher-ci

# All Rust jobs share a pre-baked CI image (.ci/Dockerfile) hosted in
# Forgejo's container registry, so they no longer race to apt-install
# the same ~1 GB of build deps in parallel containers (which used to
# OOM-kill the runner). The `image` job builds + pushes the image on
# cache miss and emits its ref as an output for the rest of the chain.
#
# Requires a repo secret named `REGISTRY_TOKEN` containing a Forgejo
# personal access token with package read+write scope; the workflow
# `permissions: packages: write` block alone does not elevate
# `secrets.GITHUB_TOKEN` enough to push to the registry on this
# Forgejo instance (it authenticates fine for read but 401s on push).

jobs:
  image:
    name: CI image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Install docker CLI
        # The default `runs-on: ubuntu-latest` job container
        # (node:20-bookworm) has git but no docker CLI. Install
        # docker.io so we can talk to the DinD daemon.
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        # The runner is configured with
        # `container.docker_host: tcp://docker:2375`, which auto-
        # provisions a docker:dind sidecar. The hostname `docker`
        # only resolves on the docker-compose network the runner
        # lives on — but job containers are children of the dind
        # service and live on dind's own bridge network, where
        # `docker` doesn't resolve. The dind daemon is reachable
        # from a job container at the bridge gateway IP (which is
        # the dind container itself, listening on 0.0.0.0:2375
        # because the compose env sets DOCKER_TLS_CERTDIR="").
        # `iproute2` was just pulled in as a transitive dep of the
        # docker.io install above, so `ip route` is on PATH.
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          # Strict hash over the inputs that determine image content.
          # Year+week prefix forces a weekly rebuild so distro security
          # updates roll in even when no input file has changed.
          hash=$(cat \
              .ci/Dockerfile \
              scripts/deps/build.pkgs \
              scripts/deps/run.pkgs \
              scripts/deps/test.pkgs \
              scripts/lib/deps.sh \
            | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Wait for DinD daemon
        # Even after the sidecar is up, the daemon can take a few
        # seconds before it answers requests. Poll until ready.
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon at $DOCKER_HOST never became ready."
          echo "::error::Confirm the runner has container.docker_host: tcp://docker:2375 set"
          echo "::error::and a docker:dind sidecar reachable from job containers."
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          docker build -t "$ref" -f .ci/Dockerfile .
          docker push "$ref"

  image-android:
    name: CI image (Android)
    # Layers the JDK + Android SDK onto the base CI image so the
    # companion-android Gradle job gets a ready ~1 GB SDK without every
    # Rust-only job paying the pull. Same build-push-on-hash-miss shape
    # as the base `image` job above; see .ci/Dockerfile.android.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Install docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          # Hash the Android-layer inputs plus the base image ref. The
          # base ref already encodes the base Dockerfile + deps hashes,
          # so folding it in rebuilds this image whenever the base does
          # or the SDK inputs change. Year+week prefix keeps the weekly
          # security-update rebuild.
          hash=$( { cat \
                .ci/Dockerfile.android \
                scripts/deps/android.pkgs \
                scripts/lib/deps.sh; \
              printf '%s' "$BASE_REF"; \
            } | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}-android:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Wait for DinD daemon
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon at $DOCKER_HOST never became ready."
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          # Pull the base image explicitly so the dind daemon has it
          # locally for the FROM (it may not be in the daemon's cache).
          docker pull "$BASE_REF"
          docker build \
            --build-arg BASE_IMAGE="$BASE_REF" \
            -t "$ref" -f .ci/Dockerfile.android .
          docker push "$ref"

  build:
    name: Build
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          # The image already provides ~/.cargo/bin (bpf-linker) and
          # ~/.rustup/toolchains; only the dep registry and target/
          # vary by branch and warrant per-branch caching.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Build
        run: ./scripts/shepherd build

  test:
    name: Test
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Run tests
        run: cargo test --all-targets

  e2e:
    name: E2E
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Build binaries (e2e harness execs them from target/debug)
        run: ./scripts/shepherd build

      - name: Run e2e tests
        run: cargo test -p shepherd-e2e -- --include-ignored --test-threads=1

  lint:
    name: Clippy
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  versions:
    name: Version harmony
    # No custom image needed: the default job container (node:20-bookworm) has
    # bash + node + grep, which is all `shepherd version check` requires. This
    # fails if any synced version literal drifts from the canonical VERSION file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version harmony
        run: ./scripts/shepherd version check

  firewall:
    name: Firewall E2E
    needs: image
    runs-on: ubuntu-latest
    # The test (crates/shepherd-e2e/tests/firewall_real.rs) needs systemd
    # as PID1 + polkit + dbus + a writable cgroup hierarchy + the BPF
    # capabilities for cgroup_skb attach. The runner config has
    # `container.privileged: false`, which we *don't* want to flip
    # globally (it would erode isolation for every other job). Instead,
    # this job stays a regular non-privileged Forgejo job and uses the
    # dind sidecar it already has access to to launch a private
    # privileged container with `--entrypoint /sbin/init`, copies the
    # workspace into it via `tar | docker exec`, and drives the test
    # there over `docker exec`. The sidecar is torn down on exit.
    steps:
      - name: Install docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Wait for DinD daemon
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::DinD daemon never became ready"
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Run firewall_real in a privileged systemd sidecar
        env:
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: |
          set -euo pipefail

          # Boot a private sidecar with systemd as PID1.
          cid=$(docker run -d --rm \
              --privileged \
              --cgroupns=host \
              --tmpfs /run \
              --tmpfs /run/lock \
              --entrypoint /sbin/init \
              "$IMAGE_REF")
          echo "sidecar container id: $cid"
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT

          # Wait for systemd to settle. `degraded` is OK — masked units
          # don't count as failures we care about here.
          docker exec "$cid" bash -c '
            for _ in $(seq 1 60); do
              case "$(systemctl is-system-running 2>/dev/null || true)" in
                running|degraded) exit 0 ;;
              esac
              sleep 1
            done
            echo "::error::systemd never became ready inside the sidecar"
            systemctl --no-pager --no-legend list-units --state=failed || true
            exit 1
          '

          # Copy the workspace in. The runner job and the dind daemon
          # do not share a filesystem, so `--volume` between them
          # silently mounts the wrong path; tar-pipe over `docker exec`
          # is the cleanest way across that boundary.
          docker exec "$cid" mkdir -p /work
          tar -c -C "$PWD" --exclude=./target --exclude=./.git . \
            | docker exec -i "$cid" tar -xC /work

          # Build everything (webui + workspace) so the TestHarness has
          # shepherdd, shepherd-launcher, shepherd-hud, and the firewall
          # helper under target/debug. Then install the helper via the
          # project's own installer (drops polkit policy + rule, creates
          # the shepherd-firewall group, adds the test user to it).
          #
          # The helper rejects `--uid 0` to prevent a polkit-blessed user
          # from launching activities as root through it, so shepherdd —
          # and therefore the test process that boots shepherdd — must
          # run as a non-root user. Create a `tester` account and run
          # cargo test under it via `runuser`, which re-execs with the
          # full supplementary group set (incl. shepherd-firewall just
          # added by the installer) so polkit's isInGroup() check passes.
          docker exec "$cid" bash -c '
            set -euo pipefail
            cd /work
            ./scripts/shepherd build

            useradd --create-home --user-group tester
            ./scripts/shepherd install firewall --debug --user tester
            systemctl restart polkit

            # Hand the workspace and root'\''s rustup install over to
            # tester so cargo can write target/ and reuse the populated
            # registry at /root/.cargo (toolchain at /root/.cargo/bin
            # is already on PATH via the image ENV). /root itself stays
            # 0700 — only +x is needed so tester can traverse into it.
            chown -R tester:tester /work /root/.cargo /root/.rustup
            chmod a+x /root

            runuser -u tester -- env \
              CARGO_HOME=/root/.cargo \
              RUSTUP_HOME=/root/.rustup \
              bash -c "
                cd /work
                cargo test -p shepherd-e2e --test firewall_real -- \
                  --include-ignored --test-threads=1 --nocapture
              "
          '

  android-portability:
    name: Android portability (shepherd-media-core)
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Add aarch64-linux-android target
        run: rustup target add aarch64-linux-android

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # We `cargo check` rather than `cargo build` because we only need to
      # verify that shepherd-media-core's dependencies and code compile for
      # the Android target — we don't need an Android linker. This job exists
      # to fail loudly if a Linux-specific dep gets added to the core.
      - name: Check shepherd-media-core for aarch64-linux-android
        run: |
          cargo check \
            --target aarch64-linux-android \
            --no-default-features \
            -p shepherd-media-core

  android-companion:
    name: Android companion (unit tests)
    # Runs on the Android CI image, which already carries the JDK + SDK at
    # /opt/android-sdk (with ANDROID_SDK_ROOT set), so there's no per-run
    # toolchain download. Only the Gradle/Maven dep cache — which churns
    # with build.gradle edits — rides on actions/cache.
    needs: image-android
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-android.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('companion-android/gradle/libs.versions.toml', 'companion-android/gradle/wrapper/gradle-wrapper.properties', 'companion-android/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # JVM unit tests only (the hardware-independent framing codec +
      # wire-decode of every sampled spec payload). No emulator; the live
      # pair/claim path stays a manual smoke test.
      - name: Run companion-android unit tests
        working-directory: companion-android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  android-media:
    name: Android media (cargo-ndk build)
    # Cross-compiles the shepherd-media-android Rust cdylib for
    # aarch64-linux-android exactly as the app's Gradle build does (the
    # `cargoNdkBuild` task in android/app/build.gradle.kts), so a break in the
    # device build fails CI without paying for the full AGP/APK assembly.
    #
    # Runs on the Android CI image for its prebuilt NDK (baked in at
    # $ANDROID_SDK_ROOT/ndk by `deps install android`). cargo-ndk and the Rust
    # target are the only per-run additions, cached so they install at most once
    # per Cargo.lock; unlike android-portability's `cargo check` of the core,
    # this fully builds and links the cdylib against the vendored libmpv.
    needs: image-android
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-android.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry, cargo-ndk, and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: ${{ runner.os }}-cargo-media-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-media-android-

      - name: Install cargo-ndk and the aarch64-linux-android target
        run: |
          rustup target add aarch64-linux-android
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk

      # Mirrors android/app/build.gradle.kts's cargoNdkBuild task. cargo-ndk
      # also auto-detects the NDK under $ANDROID_SDK_ROOT/ndk, but we point
      # ANDROID_NDK_HOME at it explicitly so the build never depends on that
      # heuristic (and matches how the crate README tells developers to build).
      - name: Build shepherd-media-android cdylib
        run: |
          ANDROID_NDK_HOME="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | head -n1)"
          export ANDROID_NDK_HOME
          cargo ndk -t arm64-v8a build -p shepherd-media-android --release

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          apt-get update
          apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # SC1091: Not following sourced files (info only, safe to ignore)
          shellcheck -e SC1091 scripts/shepherd scripts/dev scripts/admin
          shellcheck -e SC1091 scripts/lib/*.sh
          shellcheck -e SC1091 run-dev

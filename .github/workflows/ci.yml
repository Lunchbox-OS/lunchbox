name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  # Every `target/` cache below was carrying full DWARF, which is what made them
  # multi-gigabyte: the `test` one alone reached 2.91 GB, and the nine of them
  # together 10.53 GB against GitHub's 10 GB per-repository cache quota, so they
  # had begun evicting each other. Line tables keep what CI actually reads out
  # of a failure -- file and line in a panic backtrace -- and drop the variable
  # and type DWARF that only an interactive debugger uses.
  #
  # Set here rather than in Cargo.toml's [profile.dev] on purpose: a developer
  # running `cargo build` locally keeps a fully debuggable binary. The `test`
  # and `bench` profiles inherit `dev`, so this covers `cargo test` too.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

# All Rust jobs share a pre-baked CI image (.ci/Dockerfile) published to GHCR,
# so they don't race to apt-install the same ~1 GB of build deps in parallel
# containers (which used to OOM-kill the runner). Building and publishing those
# images (on content-hash miss) lives in the reusable `images.yml` workflow; the
# `images` job below calls it and re-exposes the refs for the rest of the chain.
#
# No PAT: `permissions: packages: write` plus the ambient `GITHUB_TOKEN` both
# pushes the images and pulls them for `container:`. The Forgejo original needed
# a `REGISTRY_TOKEN` secret because that registry authenticated the ambient
# token for read but 401'd on push. `secrets: inherit` is kept on the `images`
# call so the reusable workflow keeps working if a PAT is reintroduced.
#
# Cargo caching is split in two so the parallel compile jobs cooperate instead
# of racing:
#   * The dep registry (/usr/local/cargo/{registry,git}) lives under ONE shared
#     key. The `warmup` job below populates it once (via `cargo fetch`) before
#     any compile job starts, so build/test/e2e/lint/package don't each cold-
#     download the same crates in parallel. Those jobs restore it read-only
#     (actions/cache/restore) — only `warmup` ever writes it, so there's no
#     save race on the shared key.
#   * target/ lives under a PER-JOB key. `cargo test --all-targets`,
#     `cargo clippy --all-targets`, and a plain build produce different target/
#     contents, so a single shared key had them clobbering each other's save.
#     Per-job keys let each keep its own incremental artifacts.

jobs:
  # One call per image, not one call building all three. `needs:` on a
  # reusable-workflow call is all-or-nothing, so while these were a single call
  # every job waited for every image: on a cold build the base was ready at
  # 16:14:35 and nothing started until 16:20:11, because the Android and cross
  # layers (and the outputs-settling job that is now gone) had to finish first.
  # 5m36s of idling for jobs that only ever wanted the base image.
  image-base:
    name: CI image
    uses: ./.github/workflows/image.yml
    with:
      kind: base
    permissions:
      packages: write
    secrets: inherit

  image-android:
    name: CI image (Android)
    needs: image-base
    uses: ./.github/workflows/image.yml
    with:
      kind: android
      base-ref: ${{ needs.image-base.outputs.ref }}
    permissions:
      packages: write
    secrets: inherit

  image-cross:
    name: CI image (arm64 cross)
    needs: image-base
    uses: ./.github/workflows/image.yml
    with:
      kind: cross
      base-ref: ${{ needs.image-base.outputs.ref }}
      target-arch: arm64
    permissions:
      packages: write
    secrets: inherit

  warmup:
    name: Warm cargo registry
    needs: image-base
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-base.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Populate (and, on a lockfile change, refresh) the shared dep registry
      # once. This job is the ONLY writer of the registry key; downstream
      # compile jobs restore it read-only. actions/cache skips the post-run
      # save on an exact-key hit, so a warm run costs nothing extra here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Fetch dependencies
        # --locked also guards against a stale committed Cargo.lock: it fails
        # here (before any compile job) rather than silently updating it in-CI.
        run: cargo fetch --locked

  build:
    name: Build
    needs: [image-base, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-base.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The image already provides /usr/local/cargo/bin (bpf-linker) and
      # ~/.rustup/toolchains; only the dep registry (shared, populated by
      # `warmup`) and target/ (per-job) vary and warrant caching.
      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-build-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-build-v2-

      - name: Build
        run: ./scripts/shepherd build

      # Hand target/debug to the two jobs that were compiling this same
      # workspace again: `e2e`, which opened with its own
      # `./scripts/shepherd build`, and `firewall`, which cannot reach
      # actions/cache at all from inside its privileged container and so paid a
      # full cold build on every run -- 6m42s, the longest job in the suite.
      #
      # Tarred rather than uploaded as a file tree, for two reasons:
      # upload-artifact does not preserve the executable bit, and the e2e
      # harness execs these binaries; and a tree of tens of thousands of small
      # files uploads far slower than one stream. gzip -1 rather than zstd
      # because zstd is not in the image's package set, and
      # `compression-level: 0` so the artifact is not compressed a second time.
      #
      # `incremental/` is excluded: it is large and only accelerates a rebuild
      # in the same directory, which no consumer does.
      - name: Pack target/debug for e2e and firewall
        run: |
          tar -I 'gzip -1' -cf /tmp/target-debug.tar.gz \
            --exclude=./target/debug/incremental \
            -C "$GITHUB_WORKSPACE" ./target/debug
          ls -lh /tmp/target-debug.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: target-debug
          path: /tmp/target-debug.tar.gz
          # Consumed within the run; nothing needs it afterwards.
          retention-days: 1
          compression-level: 0

  build-arm64:
    name: Build (arm64 cross)
    # Cross-compiles the workspace for arm64 on this amd64 runner. It is the
    # only arm64 build that can be a required check, because it is the only one
    # that runs on always-up hardware -- correctness on arm64 is covered
    # separately on a native machine, since cross-compiling buys no test
    # coverage at all (see CONTRIBUTING, "Running the suites natively on
    # arm64").
    #
    # What this catches is what actually recurs: a new dependency that does not
    # cross, an arch-specific compile error, and packaging breakage via the
    # arm64 leg of `package` below.
    #
    # No clippy leg. Running `cargo clippy --workspace --all-targets -D
    # warnings` natively on aarch64 produced zero findings -- no integer-width
    # or c_char-signedness lints -- and the workspace has no cfg(target_arch)
    # gates outside the wasm crate, so a second clippy target would cost
    # minutes per PR to re-report what the amd64 `lint` job already says.
    # Measurements: docs/ai/history/2026-09-04 002.
    needs: [image-cross, warmup]
    runs-on: ubuntu-latest
    container:
      # The cross image, not the base one: it carries the cross toolchain and
      # the arm64 sysroot, and is 1.5-2.5 GB larger. Only this job and the
      # arm64 leg of `package` pull it.
      image: ${{ needs.image-cross.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Assert this job got the arm64 cross image
        # First, and before checkout: if this job did not get the cross image,
        # nothing after it can succeed, and what it fails with points
        # somewhere else entirely -- `rustc: command not found` when the
        # container is dropped (an empty image ref), or E0463 "can't find
        # crate for `core`" when the container is some other image. Both were seen on Forgejo run 462 against
        # a cross image that was published and correct, so the ref itself is
        # printed: it is the one fact the rest of the log cannot recover.
        shell: sh
        env:
          CROSS_REF: ${{ needs.image-cross.outputs.ref }}
        run: |
          echo "cross-ref: '$CROSS_REF'"
          if [ -z "$CROSS_REF" ]; then
            echo "::error::needs.image-cross.outputs.ref is empty, so this job is not running in the arm64 cross image. Check that the CI image (arm64 cross) job succeeded and produced a ref."
            exit 1
          fi
          if ! rustup target list --installed 2>/dev/null | grep -qx aarch64-unknown-linux-gnu; then
            echo "::error::cross-ref is '$CROSS_REF', but this environment has no aarch64-unknown-linux-gnu std (or no rustup on PATH). It is not the image that ref names."
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          # A cross build lands in target/<triple>/, not target/, so it shares
          # nothing with the amd64 jobs' artifacts -- hence its own key, per
          # the per-job-key convention already in this file.
          path: target
          key: ${{ runner.os }}-cargo-target-build-arm64-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-build-arm64-v2-

      - name: Build for arm64
        # --arch (not --target): build.sh derives the triple with
        # dpkg-architecture and passes --target on the command line, which is
        # what keeps CARGO_BUILD_TARGET out of the environment and so out of
        # the sibling eBPF build. See crates/shepherd-firewall-helper/build.rs.
        run: ./scripts/shepherd build --arch arm64

      - name: Assert the binaries are actually arm64
        # A cross build that silently fell back to the host would otherwise
        # pass this job and only be caught when someone installed the .deb.
        shell: bash
        run: |
          set -euo pipefail
          dir=target/aarch64-unknown-linux-gnu/debug
          for bin in shepherdd shepherd-launcher shepherd-hud shepherd-media; do
            out="$(file -b "$dir/$bin")"
            echo "$bin: $out"
            grep -q "ARM aarch64" <<<"$out" || {
              echo "::error::$bin is not an arm64 binary: $out"
              exit 1
            }
          done

      - name: Assert the eBPF object stayed on its own target
        # The failure this guards is silent and specific: an exported
        # CARGO_BUILD_TARGET would retarget the BPF crate off
        # bpfel-unknown-none. Nothing here sets it, which is precisely why a
        # regression would go unnoticed without an assertion.
        shell: bash
        run: |
          set -euo pipefail
          obj=crates/shepherd-firewall-bpf/target/bpfel-unknown-none/release/shepherd-firewall-bpf
          out="$(file -b "$obj")"
          echo "$obj: $out"
          grep -q "eBPF" <<<"$out" || {
            echo "::error::BPF object is not eBPF: $out"
            exit 1
          }

  test:
    name: Test and Clippy
    # Clippy runs here rather than in a job of its own. Both commands are
    # `--workspace --all-targets` over the same lockfile, so as separate jobs
    # they kept two target/ caches of substantially the same build -- 2.91 GB
    # and 0.64 GB -- and compiled it twice. Clippy goes first: it fails fast on
    # a lint, and what it compiles the tests then reuse.
    #
    # The cost is that `Clippy` is no longer a separate check. It was not on the
    # critical path either way (that is `warmup` -> `Package (arm64)`), so this
    # does not lengthen a run.
    needs: [image-base, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-base.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-test-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-test-v2-

      # `--workspace`, not the bare default-members set: the codegen crate is
      # excluded from `default-members` so `cargo build` never compiles schemars
      # into the shipped binaries, and the side effect was that its tests — the
      # drift check that is supposed to fail CI when a generated client mirror
      # goes stale — were never running here at all.
      # Run as the image's unprivileged `ci` user, not root. CI ran everything
      # as root, and that hid a real bug: `classify` accepts root from any
      # cgroup by design, so three peer tests never reached the cgroup
      # comparison they exist to make — one failed outright once the runner met
      # the kernel floor, and two had been passing without testing anything
      # (issue #144). A device never runs an activity as root.
      #
      # `chown` because `actions/checkout` runs as root and cargo has to write
      # `target/`. The environment is passed explicitly rather than through
      # `sudo -E`: sudoers' `env_reset` and `secure_path` decide what survives,
      # and the one variable that must not be dropped is the one that turns a
      # skipped peer-cgroup test into a failure — losing it would quietly
      # restore exactly the blind spot this step exists to remove.
      # `--workspace` for the same reason the test run below uses it: the crates
      # kept out of `default-members` still have to lint, and naming them here
      # would be one more list to forget to update.
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: |
          chown -R ci: . "$CARGO_HOME"
          sudo -u ci env \
            "PATH=$PATH" \
            "CARGO_HOME=$CARGO_HOME" \
            "RUSTUP_HOME=$RUSTUP_HOME" \
            "SHEPHERD_REQUIRE_PEER_CGROUP=$SHEPHERD_REQUIRE_PEER_CGROUP" \
            cargo test --workspace --all-targets
        env:
          # Insist that the peer-cgroup check in shepherd-ipc actually runs
          # (issue #144). It needs SO_PEERPIDFD + PIDFD_GET_INFO, and these jobs
          # run in a container, so they get the *host's* kernel however new the
          # image is. Below the floor those tests skip -- and a skip is
          # invisible, because cargo captures a passing test's output, so a
          # green run would say nothing about whether the check was exercised.
          # With this set the skip becomes a failure naming the reason instead.
          SHEPHERD_REQUIRE_PEER_CGROUP: "1"

  e2e:
    name: E2E
    needs: [image-base, warmup, build]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-base.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      # No target/ cache here any more, and no build either: `build` already
      # compiled this workspace in this same run, and its artifact is always a
      # hit where a cache could miss or be evicted. Worth 1.81 GB of the
      # repository's 10 GB cache quota.
      #
      # This job is a container job, so its workspace is at the same absolute
      # path as `build`'s (/__w/<repo>/<repo>). That matters: cargo's
      # fingerprints record absolute paths, and unpacking somewhere else would
      # make it rebuild everything the artifact just supplied.
      - uses: actions/download-artifact@v4
        with:
          name: target-debug
          path: /tmp

      - name: Unpack target/debug
        run: |
          tar -xf /tmp/target-debug.tar.gz -C "$GITHUB_WORKSPACE"
          ls -l target/debug/shepherdd target/debug/shepherd-launcher

      - name: Run e2e tests
        run: cargo test -p shepherd-e2e -- --include-ignored --test-threads=1
        env:
          # As in the `test` job: a kernel too old for the peer check must fail
          # here rather than skip quietly (issue #144).
          SHEPHERD_REQUIRE_PEER_CGROUP: "1"

  fmt:
    name: Rustfmt
    needs: image-base
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-base.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  webui:
    name: Web UI
    # Pinned rather than inheriting the runner's default node:20-bookworm:
    # jsdom 30, which backs the DOM tests, requires
    # ^22.22.2 || ^24.15.0 || >=26. On Node 20 those test files fail to load at
    # all — `webidl.util.markAsUncloneable is not a function`, thrown by the
    # undici jsdom pulls in — while every pure test still passes, so the run
    # reports fewer passing files rather than anything that reads as a version
    # problem. Pinned to a supported major rather than downgrading jsdom.
    #
    # The base image moving to 26.04 does not retire this pin, which is worth
    # stating because it looks like it should: 26.04 ships nodejs 22.22.1, and
    # `^22.22.2` wants 22.22.2. One patch short. Use this image, not the base
    # one, until Ubuntu's 22.x moves or jsdom's floor does.
    #
    # Types are deliberately NOT checked here; that lives in `config-editor`.
    # rsbuild transpiles without type-checking, so a genuine type error compiles
    # and ships — a `Switch` prop that does not exist on MUI v9 reached a
    # release that way, silently dropping the control's accessible name — which
    # is why the check exists at all. It cannot run here: `src/config/` imports
    # `src/config/wasm/`, which wasm-pack generates and this job has no Rust
    # toolchain to build, so tsc fails on the import alone.
    runs-on: ubuntu-latest
    container:
      image: node:22-bookworm
    defaults:
      run:
        working-directory: shepherd-webui
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: npm ci

      # `src/config/` compiles into the standalone bundle, which has no daemon
      # to talk to. An import reaching back into `src/api/` would drag axios and
      # the wire types into a bundle that can never use them.
      - name: Check the config editor's import boundary
        run: npm run check:boundary

      # A field added to schema.rs and never wired into the editor is a field
      # nobody can set. Catches whole-field omissions; see the script's header
      # for what it cannot catch.
      - name: Check the config editor covers the schema
        run: npm run check:coverage

      # Includes the jsdom-backed navigation tests. They stub the wasm-backed
      # document, so this job still needs no Rust toolchain.
      - name: Unit tests
        run: npm test

  package:
    name: Package (.deb smoke build, ${{ matrix.arch }})
    # Builds the .deb on every push/PR to catch packaging breakage before a
    # release tag ever runs release.yml. Nothing is published — this only
    # proves `shepherd package deb` (release build → DESTDIR stage → dpkg-deb)
    # still works. Runs as root in the container, so no fakeroot is needed.
    #
    # Matrixed over both architectures so the arm64 package -- which is what
    # release.yml will publish -- gets the same smoke build and the same
    # xz assertion. The two legs differ only in the image and the --arch value:
    # `dpkg-deb -I` and `ar t` are arch-agnostic. (The legs always pass --arch,
    # so the no---arch default is checked separately, in the arch-neutral job.)
    # Both images: the matrix picks the cross one for arm64 and the base one for
    # amd64, and a single job cannot depend on a different thing per matrix leg.
    # So the amd64 leg still waits for the cross image. Splitting the matrix in
    # two would fix that at the cost of duplicating every assertion below.
    needs: [image-base, image-cross, warmup]
    runs-on: ubuntu-latest
    strategy:
      # Don't let one architecture's failure hide the other's result.
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container:
      # arm64 needs the cross image (toolchain + sysroot); amd64 builds
      # natively in the base one. Selected here rather than in the matrix
      # because `container:` is where both `needs` and `matrix` are available.
      image: ${{ matrix.arch == 'arm64' && needs.image-cross.outputs.ref || needs.image-base.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Assert this job got the arm64 cross image
        if: matrix.arch == 'arm64'
        # First, and before checkout: if this job did not get the cross image,
        # nothing after it can succeed, and what it fails with points
        # somewhere else entirely -- `rustc: command not found` when the
        # container is dropped (an empty image ref), or E0463 "can't find
        # crate for `core`" when the image expression above falls through: an empty cross-ref makes
        # `arm64 && '' || base-ref` pick the *base* image, silently. Both were seen on Forgejo run 462 against
        # a cross image that was published and correct, so the ref itself is
        # printed: it is the one fact the rest of the log cannot recover.
        shell: sh
        env:
          CROSS_REF: ${{ needs.image-cross.outputs.ref }}
        run: |
          echo "cross-ref: '$CROSS_REF'"
          if [ -z "$CROSS_REF" ]; then
            echo "::error::needs.image-cross.outputs.ref is empty, so this job is not running in the arm64 cross image. Check that the CI image (arm64 cross) job succeeded and produced a ref."
            exit 1
          fi
          if ! rustup target list --installed 2>/dev/null | grep -qx aarch64-unknown-linux-gnu; then
            echo "::error::cross-ref is '$CROSS_REF', but this environment has no aarch64-unknown-linux-gnu std (or no rustup on PATH). It is not the image that ref names."
            exit 1
          fi
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          # Per-arch key: a cross build lands in target/<triple>/ and shares
          # nothing with the amd64 leg's artifacts. (This renames the amd64
          # key too, so that leg takes one cold cache on the first run after
          # this lands.)
          path: target
          key: ${{ runner.os }}-cargo-target-package-${{ matrix.arch }}-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-package-${{ matrix.arch }}-v2-

      - name: Build .deb
        run: ./scripts/shepherd package deb --arch ${{ matrix.arch }} --out dist/pkg

      - name: Inspect package metadata
        run: dpkg-deb -I dist/pkg/*.deb

      - name: Assert the package is labelled for the right architecture
        # `Architecture:` comes from --arch and the staged binaries come from
        # target/<triple>/; if those two ever disagree the package installs on
        # the wrong machine and fails at exec time. Check both.
        shell: bash
        run: |
          set -euo pipefail
          deb="$(echo dist/pkg/*.deb)"
          got="$(dpkg-deb -f "$deb" Architecture)"
          echo "$deb declares Architecture: $got"
          [ "$got" = "${{ matrix.arch }}" ] || {
            echo "::error::expected Architecture: ${{ matrix.arch }}, got $got"
            exit 1
          }
          dpkg-deb -x "$deb" /tmp/debcheck
          out="$(file -b /tmp/debcheck/usr/bin/shepherdd)"
          echo "shepherdd: $out"
          case "${{ matrix.arch }}" in
            arm64) grep -q "ARM aarch64" <<<"$out" ;;
            *)     ! grep -q "ARM aarch64" <<<"$out" ;;
          esac || {
            echo "::error::staged binary does not match ${{ matrix.arch }}: $out"
            exit 1
          }

      - name: Assert .deb uses xz compression
        # Forgejo's Debian registry (Gitea-compat 1.22) answers the apt-registry
        # upload with HTTP 500 on a zstd control.tar — which is what dpkg-deb
        # >= 1.23 (Ubuntu 26.04, this image) produces by default. package.sh
        # pins `-Zxz`; assert both members are xz here so a drift back to the
        # zstd default is caught on every PR, not at release-tag time.
        #
        # shell: bash — the Forgejo runner defaults inline `run:` to sh (dash),
        # which can't parse the array/here-string below.
        shell: bash
        run: |
          set -euo pipefail
          debs=(dist/pkg/*.deb)
          deb="${debs[0]}"
          members="$(ar t "$deb")"
          echo "$deb members:"
          echo "$members"
          for m in control data; do
            if ! grep -Fxq "$m.tar.xz" <<<"$members"; then
              found="$(grep "^$m\.tar" <<<"$members" || echo '(none)')"
              echo "::error::$deb: expected $m.tar.xz but found: $found"
              exit 1
            fi
          done
          echo "OK: control.tar.xz + data.tar.xz"

      - name: Assert the .deb declares no conffiles
        # Issue #177: every file this package ships is shepherd's, not the
        # admin's — the sway config is generated and verified as it is written,
        # the udev and polkit rules go to their vendor directories, and the
        # bluetoothd drop-in is rendered by the postinst because its ExecStart
        # names the target's daemon. A conffile among them would put dpkg back
        # to preserving an unverified local copy across upgrades, or (as the
        # drop-in did) prompting on every device because the postinst rewrote
        # a file dpkg had just checksummed. The reasoning lives next to the
        # missing `conffiles` in scripts/lib/package.sh; read it before
        # deleting this check.
        shell: bash
        run: |
          set -euo pipefail
          debs=(dist/pkg/*.deb)
          deb="${debs[0]}"
          if dpkg-deb --ctrl-tarfile "$deb" | tar t | grep -q '^\./conffiles$'; then
            echo "::error::$deb declares conffiles:"
            dpkg-deb --ctrl-tarfile "$deb" | tar xO ./conffiles
            exit 1
          fi
          # The drop-in must not be *shipped* either: the postinst renders it
          # from the template staged under /usr/share/shepherd/systemd/.
          if dpkg-deb -c "$deb" | grep -q 'bluetooth\.service\.d/'; then
            echo "::error::$deb ships a bluetooth.service.d drop-in; the postinst should render it"
            exit 1
          fi
          echo "OK: no conffiles, and no shipped bluetoothd drop-in"

      # Everything above asserted against exactly what `shepherd package deb`
      # produced; the rename happens only now, so the checks never see a name
      # this project would not ship.
      #
      # The marker goes in the filename and not the package: dpkg reads the
      # control file, so `Version:` stays 0.5.1 and nothing installing this is
      # misled. It exists because the name dpkg generates carries only version
      # and architecture -- every PR produces an identical
      # `shepherd-launcher_0.5.1_amd64.deb`, and two of them in a downloads
      # folder are indistinguishable.
      - name: Name the .deb after the PR that built it
        shell: bash
        run: |
          set -euo pipefail
          sha="${{ github.event.pull_request.head.sha || github.sha }}"
          origin="${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || 'main' }}"
          debs=(dist/pkg/*.deb)
          deb="${debs[0]}"
          # From the control file rather than by unpicking the filename, so a
          # renamed package or a new arch needs no change here.
          pkg="$(dpkg-deb -f "$deb" Package)"
          version="$(dpkg-deb -f "$deb" Version)"
          arch="$(dpkg-deb -f "$deb" Architecture)"
          new="dist/pkg/${pkg}_${version}+${origin}.g${sha:0:7}_${arch}.deb"
          mv "$deb" "$new"
          ls -l "$new"

      # A reviewer can install this on a real device, which is the only way to
      # see packaging behaviour -- the postinst, the generated sway config, the
      # udev and polkit rules -- actually working.
      #
      # Worth knowing before that becomes routine: this .deb is unsigned, and
      # its postinst runs as root. While pull requests come from this repository
      # that is the same trust as running the branch locally. The first pull
      # request from a fork changes it, and this upload would then be handing
      # reviewers root-executing code from an unreviewed branch; gate it on
      # `github.event.pull_request.head.repo.full_name == github.repository` if
      # that day comes.
      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}-${{ github.event.pull_request.number && format('pr{0}', github.event.pull_request.number) || 'main' }}
          path: dist/pkg/*.deb
          retention-days: 14
          if-no-files-found: error

  versions:
    name: Version harmony
    # No custom image needed: the default job container (node:20-bookworm) has
    # bash + node + grep, which is all `shepherd version check` requires. This
    # fails if any synced version literal drifts from the canonical VERSION file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version harmony
        run: ./scripts/shepherd version check

  firewall:
    name: Firewall E2E
    needs: [image-base, build]
    runs-on: ubuntu-latest
    # The test (crates/shepherd-e2e/tests/firewall_real.rs) needs systemd
    # as PID1 + polkit + dbus + a writable cgroup hierarchy + the BPF
    # capabilities for cgroup_skb attach. So this job does not run *in* a
    # container: it runs on the runner host and launches a private privileged
    # container with `--entrypoint /sbin/init`, copies the workspace into it
    # via `tar | docker exec`, and drives the test there over `docker exec`.
    # The container is torn down on exit.
    #
    # On Forgejo the same shape was forced by `container.privileged: false` in
    # the runner config, and reached the daemon through the dind sidecar. A
    # GitHub-hosted runner is a VM with docker already running and permits
    # --privileged directly, so the DOCKER_HOST dance is gone; the tar-pipe
    # stays, because the workspace path still is not shared with the container.
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" --password-stdin

      # target/debug from `build`, so this job stops compiling the workspace
      # inside the container. It is the one job that cannot use actions/cache
      # for target/ -- the compile happens through `docker exec`, where the
      # action cannot follow -- so it paid a full build every run.
      - uses: actions/download-artifact@v4
        with:
          name: target-debug
          path: /tmp

      - name: Run firewall_real in a privileged systemd sidecar
        env:
          IMAGE_REF: ${{ needs.image-base.outputs.ref }}
        run: |
          set -euo pipefail

          # Boot a private sidecar with systemd as PID1.
          cid=$(docker run -d --rm \
              --privileged \
              --cgroupns=host \
              --tmpfs /run \
              --tmpfs /run/lock \
              --entrypoint /sbin/init \
              "$IMAGE_REF")
          echo "sidecar container id: $cid"
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT

          # Wait for systemd to settle. `degraded` is OK — masked units
          # don't count as failures we care about here.
          docker exec "$cid" bash -c '
            for _ in $(seq 1 60); do
              case "$(systemctl is-system-running 2>/dev/null || true)" in
                running|degraded) exit 0 ;;
              esac
              sleep 1
            done
            echo "::error::systemd never became ready inside the sidecar"
            systemctl --no-pager --no-legend list-units --state=failed || true
            exit 1
          '

          # Copy the workspace in. The runner job and the container do not
          # share a filesystem, so `--volume` between them silently mounts the
          # wrong path; tar-pipe over `docker exec` is the cleanest way across
          # that boundary.
          #
          # It lands at /__w/<repo>/<repo>, not /work, and that is load-bearing
          # now: it is the path a *container* job has its workspace at, so it is
          # where `build` compiled, and cargo's fingerprints record absolute
          # paths. Unpack target/debug anywhere else and cargo rebuilds the lot,
          # which is the entire cost this artifact exists to avoid.
          repo="${GITHUB_REPOSITORY##*/}"
          ws="/__w/${repo}/${repo}"
          echo "container workspace: $ws"
          docker exec "$cid" mkdir -p "$ws"
          tar -c -C "$PWD" --exclude=./target --exclude=./.git . \
            | docker exec -i "$cid" tar -xC "$ws"

          # target/debug from the `build` job, instead of compiling it here.
          # -z explicitly: tar auto-detects compression on a file but not on
          # stdin, and this arrives down a pipe. Without it: "tar: Archive is
          # compressed. Use -z option".
          docker exec -i "$cid" tar -xzf - -C "$ws" < /tmp/target-debug.tar.gz
          docker exec "$cid" ls -l "$ws/target/debug/shepherdd"

          # shepherdd, shepherd-launcher, shepherd-hud and the firewall helper
          # are already under target/debug, unpacked above from `build`'s
          # artifact -- this job no longer builds them. Install the helper via
          # the project's own installer (drops polkit policy + rule, creates
          # the shepherd-firewall group, adds the test user to it).
          #
          # The helper rejects `--uid 0` to prevent a polkit-blessed user
          # from launching activities as root through it, so shepherdd —
          # and therefore the test process that boots shepherdd — must
          # run as a non-root user. Create a `tester` account and run
          # cargo test under it via `runuser`, which re-execs with the
          # full supplementary group set (incl. shepherd-firewall just
          # added by the installer) so polkit's isInGroup() check passes.
          docker exec "$cid" bash -c '
            set -euo pipefail
            cd "'"$ws"'"

            # First, the cgroup path (issue #151). `firewall_real` below
            # covers the Process kind, which wraps the launch in
            # `systemd-run` and never loads the embedded BPF
            # object -- so a helper that could not even parse it
            # passed CI for months while every firewalled flatpak ran
            # unfiltered. This drives `apply-cgroup` directly against a
            # cgroup made for the purpose and checks that packets really
            # are filtered. It runs as root (it creates cgroups and loads
            # BPF) and needs no polkit, user session, flatpak or snapd.
            # REQUIRED=1 turns an unmet precondition into a failure, so a
            # sidecar that cannot run it says so instead of passing quietly.
            SHEPHERD_FIREWALL_CGROUP_REQUIRED=1 \
              cargo test -p shepherd-e2e --test firewall_cgroup -- \
                --include-ignored --test-threads=1 --nocapture

            # Again, with /sys/fs/cgroup forced read-only. Whether the sidecar
            # gives us a writable cgroupfs varies between runs -- one run of
            # this job failed with EROFS creating the cgroup and the next found
            # it writable -- so the fallback that mounts cgroup2 a second time
            # for a writable view of the same hierarchy would otherwise be the
            # least-exercised code in the firewall path, running for the first
            # time on whichever run happens to land on a read-only host.
            # The mount namespace is private, so nothing here escapes this
            # command. Costs about 6s.
            unshare -m --propagation private bash -c "
              set -euo pipefail
              mount --bind /sys/fs/cgroup /sys/fs/cgroup
              mount -o remount,bind,ro /sys/fs/cgroup
              if mkdir /sys/fs/cgroup/shepherd-ro-check 2>/dev/null; then
                rmdir /sys/fs/cgroup/shepherd-ro-check
                echo ::error::could-not-make-cgroupfs-read-only-fallback-not-exercised
                exit 1
              fi
              SHEPHERD_FIREWALL_CGROUP_REQUIRED=1 \
                cargo test -p shepherd-e2e --test firewall_cgroup -- \
                  --include-ignored --test-threads=1 --nocapture 2>&1 \
                | tee /tmp/firewall-cgroup-readonly.log
              # Belt and braces: prove the run really took the fallback rather
              # than quietly finding a writable /sys/fs/cgroup after all.
              grep -q private.cgroup2.mount /tmp/firewall-cgroup-readonly.log
            "

            useradd --create-home --user-group tester
            ./scripts/shepherd install firewall --debug --user tester
            systemctl restart polkit

            # Hand the workspace to tester so cargo can write target/. The
            # toolchain and the dep registry live in /usr/local/{cargo,rustup}
            # and the image already makes them writable by any user, so they
            # need no chown here — and must not get one, since they are shared
            # with every other user rather than owned by tester.
            #
            # No apostrophes in this comment: the whole block is a
            # single-quoted argument to `bash -c`, so one would close the
            # string early. That is what broke run 4516.
            chown -R tester:tester .

            runuser -u tester -- env \
              CARGO_HOME="$CARGO_HOME" \
              RUSTUP_HOME="$RUSTUP_HOME" \
              PATH="$PATH" \
              bash -c "
                cd '"$ws"'
                cargo test -p shepherd-e2e --test firewall_real -- \
                  --include-ignored --test-threads=1 --nocapture
              "
          '

  # (Removed: the `android-portability` job cargo-checked shepherd-media-core
  # for aarch64-linux-android with --no-default-features. That's now redundant:
  # `android-media` below builds shepherd-media-android, which depends on core
  # with `default-features = false` for the same target — a strict superset that
  # would catch any Linux-specific dep added to the core.)

  android-companion:
    name: Android companion (unit tests)
    # Runs on the Android CI image, which already carries the JDK + SDK at
    # /opt/android-sdk (with ANDROID_SDK_ROOT set), so there's no per-run
    # toolchain download. Only the Gradle/Maven dep cache — which churns
    # with build.gradle edits — rides on actions/cache.
    needs: image-android
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-android.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # GRADLE_USER_HOME is set explicitly, and the cache names that same
      # absolute path, because the `~/.gradle/...` this used to cache never
      # existed at save time: every run ended with `Path Validation Error:
      # Path(s) specified in the action for caching do(es) not exist, hence no
      # cache is being saved`, and every run therefore re-downloaded the whole
      # dependency set. It is why this job took 227s cold and 243s warm -- no
      # faster the second time, because nothing was ever cached. Naming the
      # directory both to Gradle and to actions/cache removes the guess.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            /github/home/.gradle/caches
            /github/home/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('companion-android/gradle/libs.versions.toml', 'companion-android/gradle/wrapper/gradle-wrapper.properties', 'companion-android/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-v2-

      # JVM unit tests only (the hardware-independent framing codec +
      # wire-decode of every sampled spec payload). No emulator; the live
      # pair/claim path stays a manual smoke test.
      - name: Run companion-android unit tests
        working-directory: companion-android
        env:
          GRADLE_USER_HOME: /github/home/.gradle
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  android-media:
    name: Android media (cargo-ndk build)
    # Cross-compiles the shepherd-media-android Rust cdylib for
    # aarch64-linux-android exactly as the app's Gradle build does (the
    # `cargoNdkBuild` task in android/app/build.gradle.kts), so a break in the
    # device build fails CI without paying for the full AGP/APK assembly.
    #
    # Runs on the Android CI image, which bakes in the NDK, cargo-ndk, and the
    # Android Rust targets (all via `deps install android`), with ANDROID_NDK_HOME
    # set — so there's no per-run toolchain install. Unlike android-portability's
    # `cargo check` of the core, this fully builds and links the cdylib against
    # the vendored libmpv.
    needs: image-android
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-android.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Split, so this job stops keeping a second copy of the dep registry: it
      # used to cache registry + git + target under one key, which duplicated
      # the 0.26 GB `warmup` already publishes. Same read-only restore of the
      # shared key as every other compile job, plus a per-job target/ key.
      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-media-android-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-media-android-v2-

      # Same cargo-ndk cross-compile as android/app/build.gradle.kts's
      # cargoNdkBuild task, but debug rather than --release: this is a
      # compile-and-link gate, and a debug build catches the same breakage in
      # roughly half the time. cargo-ndk + the target + ANDROID_NDK_HOME come
      # from the image.
      - name: Build shepherd-media-android cdylib
        run: cargo ndk -t arm64-v8a build -p shepherd-media-android

  config-editor:
    name: Config editor
    needs: [image-base, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image-base.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            /usr/local/cargo/registry
            /usr/local/cargo/git
          key: ${{ runner.os }}-cargo-registry-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v2-

      # Builds crates/shepherd-config-wasm with wasm-pack, then the standalone
      # static bundle. Typechecking lives here rather than in the `webui` job
      # because `src/config/wasm/` is generated by this step and tsc needs it.
      - name: Build the standalone config editor
        run: ./scripts/shepherd build config-editor

      - name: Typecheck
        working-directory: shepherd-webui
        run: npm run typecheck

      # The bundle is uploaded now. It could not be on Forgejo: that runner
      # reports as GHES and upload-artifact@v4 hard-fails against it. What this
      # buys is a reviewer being able to download the exact bundle a PR builds
      # and open it locally, which is the only way to see the editor a change
      # produces without running the whole stack.
      #
      # It does not save release.yml any work: artifacts belong to the run that
      # made them, so a tag's run cannot pick up a PR's bundle, and that job
      # still builds its own.
      #
      # The check below stays regardless of the upload:
      # Worth checking rather than assuming: `output.distPath` in
      # rsbuild.config.ts is resolved relative to the working directory, so a
      # build run from the wrong cwd succeeds and writes somewhere else — and
      # writing into dist/ instead would put the *standalone* bundle, which
      # talks to no daemon, into the daemon binary that rust-embed builds from
      # it. (Since #185 dist/ legitimately carries the editor and its wasm —
      # from the embedded build, which this job does not run.)
      - name: Check the bundle landed in dist-standalone/
        run: |
          test -f shepherd-webui/dist-standalone/index.html
          test -d shepherd-webui/dist-standalone/static
          # dist/ ships a tracked .gitkeep, so "untouched" means nothing else.
          stray=$(ls -A shepherd-webui/dist 2>/dev/null | grep -v '^\.gitkeep$' || true)
          test -z "$stray" || { echo "standalone build wrote into dist/: $stray" >&2; exit 1; }
          echo "[OK] standalone bundle built, dist/ untouched"

      - uses: actions/upload-artifact@v4
        with:
          name: config-editor-standalone
          path: shepherd-webui/dist-standalone
          # A static bundle: no executables, so the lost executable bit that
          # forces the target/debug handoff to be tarred does not matter here.
          retention-days: 7

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        # `sudo`, unlike on Forgejo: there every job ran as root inside
        # node:20-bookworm, while a GitHub-hosted runner is a VM whose user is
        # `runner`. (ubuntu-latest preinstalls shellcheck, but install it
        # anyway so the version tracks the distro on both forges.)
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # Printed because the version decides which codes exist: 0.10 split
          # SC2329 out of SC2317, so a disable that satisfies a newer local
          # shellcheck can do nothing here. See CONTRIBUTING, "CI's ShellCheck
          # is older than yours".
          shellcheck --version | sed -n '2p'
          # SC1091: Not following sourced files (info only, safe to ignore)
          shellcheck -e SC1091 scripts/shepherd scripts/shepherd-admin scripts/dev scripts/admin
          shellcheck -e SC1091 scripts/lib/*.sh scripts/ci/*.sh
          shellcheck -e SC1091 run-dev

  arch-neutral:
    name: Arch neutrality
    # What CI does not already prove by building for arm64. The arm64 build and
    # package jobs cover the --arch path with a real cross build; these cover
    # what no job executes -- the default (no --arch) path, and the scripts the
    # .deb ships to the device -- plus the cross dependency set's drift. None
    # needs a Rust toolchain or a container, so they run on the default runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A plain `shepherd package deb` must target the host. Every other job
      # passes --arch on an amd64 runner, so a hardcoded amd64 default passes
      # them all -- and on an arm64 host silently cross-builds a consistent,
      # wrong amd64 package. This fakes `dpkg --print-architecture` and runs
      # the real package_deb with the Rust build stubbed out.
      - name: Check package deb defaults to the host architecture
        run: ./scripts/ci/check-default-arch.sh

      # Fails on an amd64/x86_64 literal in the scripts -- chiefly the libs and
      # shepherd-admin the .deb installs, which run on the device and are only
      # ever staged, never run, in CI. Lexical, so a backstop, not a proof.
      - name: Check the shipped scripts have no amd64 literals
        run: ./scripts/ci/check-arch-neutral.sh

      # Fails if scripts/deps/cross.pkgs has drifted from build.pkgs. Without
      # this the drift is silent and lands far from its cause: adding a -dev
      # dependency goes green on every native build here and breaks the cross
      # build later, with a pkg-config error naming a library nobody connects
      # to the commit.
      - name: Check the cross dependency set covers the build set
        run: ./scripts/ci/check-cross-pkgs.sh

  workflows:
    name: Workflow syntax
    # Static guard: fails if two jobs in one workflow file share a name. Forgejo
    # rejects the entire file when they do, so *nothing* in it runs — including
    # this job, when the break is in ci.yml itself. That makes this mainly a
    # local pre-push check; here it still catches a break in release.yml or
    # images.yml while ci.yml happens to be fine. Needs only bash + awk.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for duplicate job names
        run: ./scripts/ci/check-workflows.sh

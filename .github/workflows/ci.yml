name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CI_IMAGE_NAME: git.armeafamily.com/albert/shepherd-launcher-ci

# All Rust jobs share a pre-baked CI image (.ci/Dockerfile) hosted in
# Forgejo's container registry, so they no longer race to apt-install
# the same ~1 GB of build deps in parallel containers (which used to
# OOM-kill the runner). The `image` job builds + pushes the image on
# cache miss and emits its ref as an output for the rest of the chain.
#
# Requires a repo secret named `REGISTRY_TOKEN` containing a Forgejo
# personal access token with package read+write scope; the workflow
# `permissions: packages: write` block alone does not elevate
# `secrets.GITHUB_TOKEN` enough to push to the registry on this
# Forgejo instance (it authenticates fine for read but 401s on push).

jobs:
  image:
    name: CI image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - name: Install docker CLI
        # The default `runs-on: ubuntu-latest` job container
        # (node:20-bookworm) has git but no docker CLI. Install
        # docker.io so we can talk to the DinD daemon.
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        # The runner is configured with
        # `container.docker_host: tcp://docker:2375`, which auto-
        # provisions a docker:dind sidecar. The hostname `docker`
        # only resolves on the docker-compose network the runner
        # lives on — but job containers are children of the dind
        # service and live on dind's own bridge network, where
        # `docker` doesn't resolve. The dind daemon is reachable
        # from a job container at the bridge gateway IP (which is
        # the dind container itself, listening on 0.0.0.0:2375
        # because the compose env sets DOCKER_TLS_CERTDIR="").
        # `iproute2` was just pulled in as a transitive dep of the
        # docker.io install above, so `ip route` is on PATH.
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          # Strict hash over the inputs that determine image content.
          # Year+week prefix forces a weekly rebuild so distro security
          # updates roll in even when no input file has changed.
          hash=$(cat \
              .ci/Dockerfile \
              scripts/deps/build.pkgs \
              scripts/deps/run.pkgs \
              scripts/deps/test.pkgs \
              scripts/lib/deps.sh \
            | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Wait for DinD daemon
        # Even after the sidecar is up, the daemon can take a few
        # seconds before it answers requests. Poll until ready.
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon at $DOCKER_HOST never became ready."
          echo "::error::Confirm the runner has container.docker_host: tcp://docker:2375 set"
          echo "::error::and a docker:dind sidecar reachable from job containers."
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          docker build -t "$ref" -f .ci/Dockerfile .
          docker push "$ref"

  build:
    name: Build
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          # The image already provides ~/.cargo/bin (bpf-linker) and
          # ~/.rustup/toolchains; only the dep registry and target/
          # vary by branch and warrant per-branch caching.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: ./scripts/shepherd build

  test:
    name: Test
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-targets

  e2e:
    name: E2E
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binaries (e2e harness execs them from target/debug)
        run: ./scripts/shepherd build

      - name: Run e2e tests
        run: cargo test -p shepherd-e2e -- --include-ignored --test-threads=1

  lint:
    name: Clippy
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          apt-get update
          apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # SC1091: Not following sourced files (info only, safe to ignore)
          shellcheck -e SC1091 scripts/shepherd scripts/dev scripts/admin
          shellcheck -e SC1091 scripts/lib/*.sh
          shellcheck -e SC1091 run-dev

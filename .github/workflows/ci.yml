name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

# All Rust jobs share a pre-baked CI image (.ci/Dockerfile) hosted in Forgejo's
# container registry, so they don't race to apt-install the same ~1 GB of build
# deps in parallel containers (which used to OOM-kill the runner). Building and
# publishing those images (on content-hash miss) lives in the reusable
# `images.yml` workflow; the `images` job below calls it and re-exposes the refs
# for the rest of the chain.
#
# Requires a repo secret named `REGISTRY_TOKEN` containing a Forgejo personal
# access token with package read+write scope; the `permissions: packages: write`
# block alone does not elevate `secrets.GITHUB_TOKEN` enough to push to the
# registry on this Forgejo instance (it authenticates fine for read but 401s on
# push). `secrets: inherit` passes REGISTRY_TOKEN through to the reusable
# workflow.
#
# Cargo caching is split in two so the parallel compile jobs cooperate instead
# of racing:
#   * The dep registry (~/.cargo/registry + ~/.cargo/git) lives under ONE shared
#     key. The `warmup` job below populates it once (via `cargo fetch`) before
#     any compile job starts, so build/test/e2e/lint/package don't each cold-
#     download the same crates in parallel. Those jobs restore it read-only
#     (actions/cache/restore) — only `warmup` ever writes it, so there's no
#     save race on the shared key.
#   * target/ lives under a PER-JOB key. `cargo test --all-targets`,
#     `cargo clippy --all-targets`, and a plain build produce different target/
#     contents, so a single shared key had them clobbering each other's save.
#     Per-job keys let each keep its own incremental artifacts.

jobs:
  images:
    name: CI images
    uses: ./.github/workflows/images.yml
    permissions:
      packages: write
    secrets: inherit

  warmup:
    name: Warm cargo registry
    needs: images
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Populate (and, on a lockfile change, refresh) the shared dep registry
      # once. This job is the ONLY writer of the registry key; downstream
      # compile jobs restore it read-only. actions/cache skips the post-run
      # save on an exact-key hit, so a warm run costs nothing extra here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-

      - name: Fetch dependencies
        # --locked also guards against a stale committed Cargo.lock: it fails
        # here (before any compile job) rather than silently updating it in-CI.
        run: cargo fetch --locked

  build:
    name: Build
    needs: [images, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # The image already provides ~/.cargo/bin (bpf-linker) and
      # ~/.rustup/toolchains; only the dep registry (shared, populated by
      # `warmup`) and target/ (per-job) vary and warrant caching.
      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-build-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-build-v1-

      - name: Build
        run: ./scripts/shepherd build

  test:
    name: Test
    needs: [images, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-test-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-test-v1-

      - name: Run tests
        run: cargo test --all-targets

  e2e:
    name: E2E
    needs: [images, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-e2e-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-e2e-v1-

      - name: Build binaries (e2e harness execs them from target/debug)
        run: ./scripts/shepherd build

      - name: Run e2e tests
        run: cargo test -p shepherd-e2e -- --include-ignored --test-threads=1

  lint:
    name: Clippy
    needs: [images, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-clippy-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-clippy-v1-

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    needs: images
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  webui:
    name: Web UI (typecheck)
    # No custom image needed: the default job container (node:20-bookworm) has
    # node + npm, which is all this needs.
    #
    # Types are checked here and nowhere else. `shepherd build` runs the SPA
    # through rsbuild, which transpiles without type-checking, so a genuine type
    # error compiles and ships — a `Switch` prop that does not exist on MUI v9
    # reached a release that way, silently dropping the control's accessible
    # name. Building the bundle is already covered by the jobs that build the
    # daemon (rust-embed needs dist/), so this job only has to typecheck.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: shepherd-webui
        run: npm ci

      - name: Typecheck
        working-directory: shepherd-webui
        run: npm run typecheck

  package:
    name: Package (.deb smoke build)
    # Builds the amd64 .deb on every push/PR to catch packaging breakage before
    # a release tag ever runs release.yml. Nothing is published — this only
    # proves `shepherd package deb` (release build → DESTDIR stage → dpkg-deb)
    # still works. Runs as root in the container, so no fakeroot is needed.
    needs: [images, warmup]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore cargo registry
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-v1-

      - name: Cache build artifacts
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-package-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-package-v1-

      - name: Build .deb
        run: ./scripts/shepherd package deb --out dist/pkg

      - name: Inspect package metadata
        run: dpkg-deb -I dist/pkg/*.deb

      - name: Assert .deb uses xz compression
        # Forgejo's Debian registry (Gitea-compat 1.22) answers the apt-registry
        # upload with HTTP 500 on a zstd control.tar — which is what dpkg-deb
        # >= 1.23 (Ubuntu 26.04, this image) produces by default. package.sh
        # pins `-Zxz`; assert both members are xz here so a drift back to the
        # zstd default is caught on every PR, not at release-tag time.
        #
        # shell: bash — the Forgejo runner defaults inline `run:` to sh (dash),
        # which can't parse the array/here-string below.
        shell: bash
        run: |
          set -euo pipefail
          debs=(dist/pkg/*.deb)
          deb="${debs[0]}"
          members="$(ar t "$deb")"
          echo "$deb members:"
          echo "$members"
          for m in control data; do
            if ! grep -Fxq "$m.tar.xz" <<<"$members"; then
              found="$(grep "^$m\.tar" <<<"$members" || echo '(none)')"
              echo "::error::$deb: expected $m.tar.xz but found: $found"
              exit 1
            fi
          done
          echo "OK: control.tar.xz + data.tar.xz"

  versions:
    name: Version harmony
    # No custom image needed: the default job container (node:20-bookworm) has
    # bash + node + grep, which is all `shepherd version check` requires. This
    # fails if any synced version literal drifts from the canonical VERSION file.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check version harmony
        run: ./scripts/shepherd version check

  firewall:
    name: Firewall E2E
    needs: images
    runs-on: ubuntu-latest
    # The test (crates/shepherd-e2e/tests/firewall_real.rs) needs systemd
    # as PID1 + polkit + dbus + a writable cgroup hierarchy + the BPF
    # capabilities for cgroup_skb attach. The runner config has
    # `container.privileged: false`, which we *don't* want to flip
    # globally (it would erode isolation for every other job). Instead,
    # this job stays a regular non-privileged Forgejo job and uses the
    # dind sidecar it already has access to to launch a private
    # privileged container with `--entrypoint /sbin/init`, copies the
    # workspace into it via `tar | docker exec`, and drives the test
    # there over `docker exec`. The sidecar is torn down on exit.
    steps:
      - name: Install docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Wait for DinD daemon
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::DinD daemon never became ready"
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Run firewall_real in a privileged systemd sidecar
        env:
          IMAGE_REF: ${{ needs.images.outputs.base-ref }}
        run: |
          set -euo pipefail

          # Boot a private sidecar with systemd as PID1.
          cid=$(docker run -d --rm \
              --privileged \
              --cgroupns=host \
              --tmpfs /run \
              --tmpfs /run/lock \
              --entrypoint /sbin/init \
              "$IMAGE_REF")
          echo "sidecar container id: $cid"
          trap 'docker stop "$cid" >/dev/null 2>&1 || true' EXIT

          # Wait for systemd to settle. `degraded` is OK — masked units
          # don't count as failures we care about here.
          docker exec "$cid" bash -c '
            for _ in $(seq 1 60); do
              case "$(systemctl is-system-running 2>/dev/null || true)" in
                running|degraded) exit 0 ;;
              esac
              sleep 1
            done
            echo "::error::systemd never became ready inside the sidecar"
            systemctl --no-pager --no-legend list-units --state=failed || true
            exit 1
          '

          # Copy the workspace in. The runner job and the dind daemon
          # do not share a filesystem, so `--volume` between them
          # silently mounts the wrong path; tar-pipe over `docker exec`
          # is the cleanest way across that boundary.
          docker exec "$cid" mkdir -p /work
          tar -c -C "$PWD" --exclude=./target --exclude=./.git . \
            | docker exec -i "$cid" tar -xC /work

          # Build everything (webui + workspace) so the TestHarness has
          # shepherdd, shepherd-launcher, shepherd-hud, and the firewall
          # helper under target/debug. Then install the helper via the
          # project's own installer (drops polkit policy + rule, creates
          # the shepherd-firewall group, adds the test user to it).
          #
          # The helper rejects `--uid 0` to prevent a polkit-blessed user
          # from launching activities as root through it, so shepherdd —
          # and therefore the test process that boots shepherdd — must
          # run as a non-root user. Create a `tester` account and run
          # cargo test under it via `runuser`, which re-execs with the
          # full supplementary group set (incl. shepherd-firewall just
          # added by the installer) so polkit's isInGroup() check passes.
          docker exec "$cid" bash -c '
            set -euo pipefail
            cd /work
            ./scripts/shepherd build

            useradd --create-home --user-group tester
            ./scripts/shepherd install firewall --debug --user tester
            systemctl restart polkit

            # Hand the workspace and root'\''s rustup install over to
            # tester so cargo can write target/ and reuse the populated
            # registry at /root/.cargo (toolchain at /root/.cargo/bin
            # is already on PATH via the image ENV). /root itself stays
            # 0700 — only +x is needed so tester can traverse into it.
            chown -R tester:tester /work /root/.cargo /root/.rustup
            chmod a+x /root

            runuser -u tester -- env \
              CARGO_HOME=/root/.cargo \
              RUSTUP_HOME=/root/.rustup \
              bash -c "
                cd /work
                cargo test -p shepherd-e2e --test firewall_real -- \
                  --include-ignored --test-threads=1 --nocapture
              "
          '

  # (Removed: the `android-portability` job cargo-checked shepherd-media-core
  # for aarch64-linux-android with --no-default-features. That's now redundant:
  # `android-media` below builds shepherd-media-android, which depends on core
  # with `default-features = false` for the same target — a strict superset that
  # would catch any Linux-specific dep added to the core.)

  android-companion:
    name: Android companion (unit tests)
    # Runs on the Android CI image, which already carries the JDK + SDK at
    # /opt/android-sdk (with ANDROID_SDK_ROOT set), so there's no per-run
    # toolchain download. Only the Gradle/Maven dep cache — which churns
    # with build.gradle edits — rides on actions/cache.
    needs: images
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.android-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('companion-android/gradle/libs.versions.toml', 'companion-android/gradle/wrapper/gradle-wrapper.properties', 'companion-android/**/build.gradle.kts') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # JVM unit tests only (the hardware-independent framing codec +
      # wire-decode of every sampled spec payload). No emulator; the live
      # pair/claim path stays a manual smoke test.
      - name: Run companion-android unit tests
        working-directory: companion-android
        run: ./gradlew --no-daemon :app:testDebugUnitTest

  android-media:
    name: Android media (cargo-ndk build)
    # Cross-compiles the shepherd-media-android Rust cdylib for
    # aarch64-linux-android exactly as the app's Gradle build does (the
    # `cargoNdkBuild` task in android/app/build.gradle.kts), so a break in the
    # device build fails CI without paying for the full AGP/APK assembly.
    #
    # Runs on the Android CI image, which bakes in the NDK, cargo-ndk, and the
    # Android Rust targets (all via `deps install android`), with ANDROID_NDK_HOME
    # set — so there's no per-run toolchain install. Unlike android-portability's
    # `cargo check` of the core, this fully builds and links the cdylib against
    # the vendored libmpv.
    needs: images
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.android-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-media-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-media-android-

      # Same cargo-ndk cross-compile as android/app/build.gradle.kts's
      # cargoNdkBuild task, but debug rather than --release: this is a
      # compile-and-link gate, and a debug build catches the same breakage in
      # roughly half the time. cargo-ndk + the target + ANDROID_NDK_HOME come
      # from the image.
      - name: Build shepherd-media-android cdylib
        run: cargo ndk -t arm64-v8a build -p shepherd-media-android

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          apt-get update
          apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # SC1091: Not following sourced files (info only, safe to ignore)
          shellcheck -e SC1091 scripts/shepherd scripts/shepherd-admin scripts/dev scripts/admin
          shellcheck -e SC1091 scripts/lib/*.sh scripts/ci/*.sh
          shellcheck -e SC1091 run-dev

  arch-neutral:
    name: Arch neutrality
    # Static guard: fails if an amd64/x86-specific literal creeps into the build
    # & packaging path, which would mislabel or break non-amd64 (e.g. arm64)
    # packages. `shepherd package deb` derives the Debian arch from the host at
    # runtime (dpkg --print-architecture); this keeps it that way. Needs no build
    # or container — just bash + grep — so it runs on the default runner even
    # though the rest of CI executes on amd64 only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check build/packaging path is architecture-neutral
        run: ./scripts/ci/check-arch-neutral.sh

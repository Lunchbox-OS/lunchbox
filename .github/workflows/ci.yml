name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CI_IMAGE_NAME: git.armeafamily.com/albert/shepherd-launcher-ci

# All Rust jobs share a pre-baked CI image (.ci/Dockerfile) hosted in
# Forgejo's container registry, so they no longer race to apt-install
# the same ~1 GB of build deps in parallel containers (which used to
# OOM-kill the runner). The `image` job builds + pushes the image on
# cache miss and emits its ref as an output for the rest of the chain.

jobs:
  image:
    name: CI image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          # Strict hash over the inputs that determine image content.
          # Year+week prefix forces a weekly rebuild so distro security
          # updates roll in even when no input file has changed.
          hash=$(cat \
              .ci/Dockerfile \
              scripts/deps/build.pkgs \
              scripts/deps/run.pkgs \
              scripts/deps/test.pkgs \
              scripts/lib/deps.sh \
            | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          docker build -t "$ref" -f .ci/Dockerfile .
          docker push "$ref"

  build:
    name: Build
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          # The image already provides ~/.cargo/bin (bpf-linker) and
          # ~/.rustup/toolchains; only the dep registry and target/
          # vary by branch and warrant per-branch caching.
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build
        run: ./scripts/shepherd build

  test:
    name: Test
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-targets

  e2e:
    name: E2E
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build binaries (e2e harness execs them from target/debug)
        run: ./scripts/shepherd build

      - name: Run e2e tests
        run: cargo test -p shepherd-e2e -- --include-ignored --test-threads=1

  lint:
    name: Clippy
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run Clippy
        run: cargo clippy --all-targets -- -D warnings

  fmt:
    name: Rustfmt
    needs: image
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.image.outputs.ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: cargo fmt --all -- --check

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: |
          apt-get update
          apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          # SC1091: Not following sourced files (info only, safe to ignore)
          shellcheck -e SC1091 scripts/shepherd scripts/dev scripts/admin
          shellcheck -e SC1091 scripts/lib/*.sh
          shellcheck -e SC1091 run-dev

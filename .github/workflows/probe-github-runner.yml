name: Probe GitHub runner

# TEMPORARY diagnostic for the Forgejo -> GitHub CI port. Deleted once the
# real workflows are validated. Answers the questions the port turns on:
# does Actions run here at all, is the host kernel new enough for the
# peer-cgroup check, and can a privileged systemd container boot.

on:
  push:
    branches: ['u/aarmea/back-to-github']
  workflow_dispatch:

jobs:
  probe:
    name: Probe
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Runner and kernel
        run: |
          echo "runner: $RUNNER_OS $RUNNER_ARCH  image: ${ImageOS:-?} ${ImageVersion:-?}"
          uname -a
          echo "whoami: $(whoami)  root? $([ "$(id -u)" = 0 ] && echo yes || echo no)"
          nproc; free -g | head -2; df -h / | tail -1

      - name: Kernel features the test/e2e jobs require
        # SHEPHERD_REQUIRE_PEER_CGROUP=1 needs SO_PEERPIDFD (Linux 6.5) and
        # PIDFD_GET_INFO (Linux 6.13). Below that floor those jobs fail.
        run: |
          set -x
          kver=$(uname -r | cut -d- -f1)
          echo "kernel=$kver"
          printf 'SO_PEERPIDFD needs >=6.5, PIDFD_GET_INFO needs >=6.13\n'
          python3 - <<'PY'
          import os, socket, ctypes, struct
          print("SO_PEERPIDFD const:", getattr(socket, "SO_PEERPIDFD", "absent in python"))
          a, b = socket.socketpair()
          try:
              v = a.getsockopt(socket.SOL_SOCKET, 77)  # SO_PEERPIDFD = 77
              print("SO_PEERPIDFD getsockopt: ok")
          except OSError as e:
              print("SO_PEERPIDFD getsockopt failed:", e)
          PY

      - name: Docker availability (no DinD sidecar on GitHub)
        run: |
          which docker && docker version --format '{{.Server.Version}}' || echo "no docker"
          echo "DOCKER_HOST=${DOCKER_HOST:-<unset>}"
          docker info --format 'cgroup driver={{.CgroupDriver}} cgroup version={{.CgroupVersion}}'

      - name: Privileged systemd container (what the firewall job needs)
        run: |
          set -x
          cid=$(docker run -d --rm --privileged --cgroupns=host \
                  --tmpfs /run --tmpfs /run/lock \
                  --entrypoint /sbin/init ubuntu:24.04 2>&1) || {
            echo "PRIVILEGED-RUN-FAILED: $cid"; exit 0; }
          for _ in $(seq 1 30); do
            s=$(docker exec "$cid" systemctl is-system-running 2>/dev/null || true)
            case "$s" in running|degraded) echo "SYSTEMD-OK: $s"; break;; esac
            sleep 1
          done
          echo "final: ${s:-none}"
          docker exec "$cid" bash -c 'ls /sys/fs/cgroup | head -5; mkdir /sys/fs/cgroup/probe && echo CGROUP-WRITABLE && rmdir /sys/fs/cgroup/probe' || echo CGROUP-READONLY
          docker stop "$cid" || true

      - name: GHCR push
        run: |
          set -x
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          echo "FROM scratch" > /tmp/Dockerfile.probe
          echo "COPY README.md /" >> /tmp/Dockerfile.probe
          docker build -f /tmp/Dockerfile.probe -t ghcr.io/aarmea/lunchbox-ci-probe:t1 .
          docker push ghcr.io/aarmea/lunchbox-ci-probe:t1 && echo GHCR-PUSH-OK

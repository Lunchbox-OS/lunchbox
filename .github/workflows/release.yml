name: Release

# Tag-driven release pipeline. Pushing a `vX.Y.Z` tag builds the amd64 `.deb`
# and a signed `.apk` per Android module, then publishes them to a Forgejo
# release (each asset gets a `.sha256` sidecar).
#
# Release flow:
#   ./scripts/shepherd version set X.Y.Z
#   git commit -am "bump to X.Y.Z" && git tag -a vX.Y.Z -m vX.Y.Z
#   git push && git push --tags
#
# See docs/ai/history/2026-07-04 003 binary-releases.md for the full design.
#
# No cross-job artifacts: Forgejo doesn't implement the upload-artifact@v4
# protocol (the runner reports as GHES and the action hard-fails). So instead of
# a build→publish handoff, `create-release` makes the release first, then the
# parallel `deb` and `apk` jobs each upload their own asset straight to it via
# the Forgejo API (scripts/ci/upload-release-asset.sh, which also writes a
# per-asset .sha256). This keeps the jobs parallel with zero artifact-backend
# dependency.
#
# Secrets required (in addition to REGISTRY_TOKEN from ci.yml):
#   RELEASE_TOKEN               repo-write PAT to create the release + upload
#                               assets. (Not FORGEJO_*/GITEA_*/GITHUB_* — Forgejo
#                               reserves those prefixes for secret names.)
#   PACKAGE_TOKEN               PAT with the write:package scope, to publish the
#                               .deb into Forgejo's Debian (apt) package registry.
#   SHEPHERD_KEYSTORE_B64       base64 of the Android release keystore
#   SHEPHERD_KEYSTORE_PASSWORD  keystore password
#   SHEPHERD_KEY_ALIAS          signing key alias
#   SHEPHERD_KEY_PASSWORD       signing key password

on:
  push:
    tags:
      - 'v*'
  # Manual dry run: builds the .deb + both signed .apks (exercising signing and
  # the media armeabi-v7a cargo-ndk cross-compile) WITHOUT creating a Forgejo
  # release — unless you tick `publish`. Run it before cutting a real vX.Y.Z tag.
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the Forgejo release + upload assets (off = dry run)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # guard: the tag must match the canonical VERSION, and all synced literals
  # must be in harmony (reuses the #83 guarantee).
  # --------------------------------------------------------------------------
  guard:
    name: Guard (tag == VERSION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only meaningful for a tag push; a manual dry run has no vX.Y.Z ref.
      - name: Tag matches VERSION
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(./scripts/shepherd version)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_version) does not match VERSION ($file_version)"
            exit 1
          fi
          echo "Releasing version $file_version"

      - name: Version harmony
        run: ./scripts/shepherd version check

  # --------------------------------------------------------------------------
  # images: build-if-missing the pre-baked CI images and expose their refs.
  # --------------------------------------------------------------------------
  images:
    name: CI images
    needs: guard
    uses: ./.github/workflows/images.yml
    permissions:
      packages: write
    secrets: inherit

  # --------------------------------------------------------------------------
  # create-release: make (or fetch) the Forgejo release up front so the parallel
  # build jobs can attach their assets to it. Runs on every trigger but only
  # touches the API when publishing; on a dry run it's a no-op and the build
  # jobs (which `need` it) still run and simply skip their upload step.
  # --------------------------------------------------------------------------
  create-release:
    name: Create release
    needs: guard
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.rel.outputs.release_id }}
    steps:
      - name: Create or fetch the Forgejo release
        id: rel
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { apt-get update && apt-get install -y jq; }
          api="${SERVER_URL}/api/v1/repos/${REPO}"
          auth="Authorization: token ${RELEASE_TOKEN}"

          # Tags with a -prerelease suffix (e.g. v0.2.0-rc1) publish as a
          # prerelease so they aren't shown as "latest" — this is how you cut a
          # release candidate to test the real signed artifacts, then delete it.
          case "${TAG#v}" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac

          # Create the release; if it already exists (a re-run), fetch it.
          code="$(curl -sS -o /tmp/rel.json -w '%{http_code}' -X POST "${api}/releases" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg t "$TAG" --argjson pre "$prerelease" \
                    '{tag_name:$t, name:$t, draft:false, prerelease:$pre}')" || true)"
          if [ "$code" = "201" ]; then
            id="$(jq -r '.id' /tmp/rel.json)"
          else
            echo "POST /releases returned $code; fetching existing release for $TAG"
            id="$(curl -fsS "${api}/releases/tags/${TAG}" -H "$auth" | jq -r '.id')"
          fi
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "::error::could not determine release id"; exit 1; }
          echo "release_id=$id" >> "$GITHUB_OUTPUT"
          echo "release id=$id"

  # --------------------------------------------------------------------------
  # deb: stage the install tree via install.sh (DESTDIR) and dpkg-deb it, then
  # (on publish) upload it + a .sha256 to the release.
  # --------------------------------------------------------------------------
  deb:
    name: Build .deb (amd64)
    needs: [guard, images, create-release]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Build .deb
        # Builds --release, stages via `DESTDIR=… shepherd install …`, runs
        # dpkg-deb. Root in the container, so no fakeroot. Output in dist/pkg/.
        run: ./scripts/shepherd package deb --out dist/pkg

      - name: Upload .deb to the release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: ./scripts/ci/upload-release-asset.sh dist/pkg/*.deb

      # Also publish to Forgejo's Debian package registry so users get an
      # `apt update`/`apt upgrade` path (the release asset above stays the
      # offline/manual download). Forgejo signs the repo metadata itself, so the
      # .deb needs no signing. Prereleases (tags with a `-`, e.g. v0.2.0-rc1) are
      # skipped so RC builds never reach `apt upgrade` users — they still get the
      # signed release asset for manual testing. See docs/INSTALL.md.
      - name: Publish .deb to the apt registry
        if: ${{ (github.event_name == 'push' && !contains(github.ref_name, '-')) || github.event.inputs.publish == 'true' }}
        env:
          SERVER_URL: ${{ github.server_url }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
          APT_DIST: stable
          APT_COMPONENT: main
        run: ./scripts/ci/publish-apt.sh dist/pkg/*.deb

      - name: Dry run note
        if: ${{ !(github.event_name == 'push' || github.event.inputs.publish == 'true') }}
        run: |
          echo "Dry run: built the .deb above; not uploading (no release)."

  # --------------------------------------------------------------------------
  # apk: one signed APK per Android module, built in parallel; each (on publish)
  # uploads itself + a .sha256. cargo-ndk, the Android Rust targets, and
  # ANDROID_NDK_HOME are baked into the android image, so there's no toolchain
  # setup here. Add a matrix row per new Android module.
  # --------------------------------------------------------------------------
  apk:
    name: Build .apk (${{ matrix.module.name }})
    needs: [guard, images, create-release]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.android-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: companion
            dir: companion-android
            gradle_module: app
            artifact: shepherd-companion
          # media is a NativeActivity app whose Gradle build cross-compiles a
          # Rust cdylib via cargo-ndk; rust: true gates the cargo cache below.
          - name: media
            dir: crates/shepherd-media-android/android
            gradle_module: app
            artifact: shepherd-media
            rust: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/gradle/libs.versions.toml', matrix.module.dir), format('{0}/**/build.gradle.kts', matrix.module.dir)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Rust-native modules only: assembleRelease invokes cargo-ndk, so cache the
      # cargo registry + target dir. Key matches ci.yml's android-media job so
      # they share the built deps. (Keeps the companion job from polluting it.)
      - name: Cache cargo (Rust-native APKs)
        if: matrix.module.rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-media-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-media-android-

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHEPHERD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SHEPHERD_KEYSTORE_B64 is not set; cannot produce a signed release APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shepherd-release.jks"

      - name: Assemble signed release APK
        working-directory: ${{ matrix.module.dir }}
        env:
          SHEPHERD_KEYSTORE_FILE: ${{ runner.temp }}/shepherd-release.jks
          SHEPHERD_KEYSTORE_PASSWORD: ${{ secrets.SHEPHERD_KEYSTORE_PASSWORD }}
          SHEPHERD_KEY_ALIAS: ${{ secrets.SHEPHERD_KEY_ALIAS }}
          SHEPHERD_KEY_PASSWORD: ${{ secrets.SHEPHERD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :${{ matrix.module.gradle_module }}:assembleRelease

      - name: Stage APK with release name
        run: |
          set -euo pipefail
          src="${{ matrix.module.dir }}/${{ matrix.module.gradle_module }}/build/outputs/apk/release"
          apk="$(find "$src" -name '*.apk' | head -n1)"
          [ -n "$apk" ] || { echo "::error::no release APK found under $src"; exit 1; }
          version="$(./scripts/shepherd version)"
          mkdir -p dist/pkg
          cp "$apk" "dist/pkg/${{ matrix.module.artifact }}_${version}.apk"

      # Validate dist/fdroid/metadata against the APK we just signed. The
      # published F-Droid repository is generated on the server that hosts
      # git.armeafamily.com, which downloads these release assets and this
      # repo's metadata at the release tag and runs `fdroid update` with nobody
      # watching — so this is the last place a bad metadata file or a
      # wrongly-signed APK can surface. `package fdroid` fails if the APK does
      # not reach the generated index, which is what a mismatched
      # AllowedAPKSigningKeys looks like (fdroid update warns, drops the APK,
      # and still exits 0). Runs on dry runs too — that is the point of them.
      # See dist/fdroid/README.md and docs/ai/history/2026-07-26 003 …spec.md.
      - name: Validate the F-Droid metadata
        run: |
          apt-get update
          # --no-install-recommends keeps this to ~67 packages / ~78 MB rather
          # than ~269 / ~300 MB: matplotlib and tk come in as Recommends of
          # androguard and `fdroid update` does not need them. Installed per job
          # rather than baked into the android CI image so that every Android CI
          # run doesn't pay for a release-only check.
          #
          # default-jdk-headless because fdroidserver signs the index with
          # /usr/lib/jvm/default-java/bin/jarsigner and unconditionally prefers
          # that path over every other JDK present (including the image's
          # openjdk-21-jdk-headless), so the default has to be a JDK.
          apt-get install -y --no-install-recommends fdroidserver default-jdk-headless
          ./scripts/shepherd package fdroid --apks dist/pkg

      - name: Upload .apk to the release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        env:
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: ./scripts/ci/upload-release-asset.sh dist/pkg/*.apk

      - name: Dry run note
        if: ${{ !(github.event_name == 'push' || github.event.inputs.publish == 'true') }}
        run: |
          echo "Dry run: built + signed the ${{ matrix.module.name }} APK; not uploading."

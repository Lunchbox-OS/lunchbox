name: Release

# Tag-driven release pipeline. Pushing a `vX.Y.Z` tag builds the amd64 `.deb`
# and a signed `.apk` per Android module, then publishes them to a Forgejo
# release with a SHA256SUMS manifest.
#
# Release flow:
#   ./scripts/shepherd version set X.Y.Z
#   git commit -am "bump to X.Y.Z" && git tag -a vX.Y.Z -m vX.Y.Z
#   git push && git push --tags
#
# See docs/ai/history/2026-07-04 003 binary-releases.md for the full design.
#
# Single-job by necessity: Forgejo does not implement the upload-artifact@v4
# protocol (the runner reports itself as GHES and the action hard-fails), so we
# can't pass built files between jobs via artifacts. Instead ONE job builds every
# asset and uploads them straight to the Forgejo Releases API (which works). The
# job runs in the Android CI image — a superset of the base image (Rust + dpkg +
# webui toolchain AND the Android SDK/NDK) — so it can build both the .deb and
# the APKs.
#
# Secrets required (in addition to REGISTRY_TOKEN from ci.yml):
#   RELEASE_TOKEN               repo-write PAT to create the release + upload
#                               assets. (Not FORGEJO_*/GITEA_*/GITHUB_* — Forgejo
#                               reserves those prefixes for secret names.)
#   SHEPHERD_KEYSTORE_B64       base64 of the Android release keystore
#   SHEPHERD_KEYSTORE_PASSWORD  keystore password
#   SHEPHERD_KEY_ALIAS          signing key alias
#   SHEPHERD_KEY_PASSWORD       signing key password

on:
  push:
    tags:
      - 'v*'
  # Manual dry run: builds the .deb + both signed .apks (exercising signing and
  # the media armeabi-v7a cargo-ndk cross-compile) WITHOUT creating a Forgejo
  # release — unless you tick `publish`. Run it before cutting a real vX.Y.Z tag.
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the Forgejo release + upload assets (off = dry run)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # guard: the tag must match the canonical VERSION, and all synced literals
  # must be in harmony (reuses the #83 guarantee).
  # --------------------------------------------------------------------------
  guard:
    name: Guard (tag == VERSION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only meaningful for a tag push; a manual dry run has no vX.Y.Z ref.
      - name: Tag matches VERSION
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(./scripts/shepherd version)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_version) does not match VERSION ($file_version)"
            exit 1
          fi
          echo "Releasing version $file_version"

      - name: Version harmony
        run: ./scripts/shepherd version check

  # --------------------------------------------------------------------------
  # images: build-if-missing the pre-baked CI images and expose their refs.
  # --------------------------------------------------------------------------
  images:
    name: CI images
    needs: guard
    uses: ./.github/workflows/images.yml
    permissions:
      packages: write
    secrets: inherit

  # --------------------------------------------------------------------------
  # release: build the .deb + both signed .apks and (on a tag push, or a
  # dispatch with `publish`) upload them to a Forgejo release. One job, no
  # cross-job artifacts — see the header note.
  # --------------------------------------------------------------------------
  release:
    name: Build & publish
    needs: [guard, images]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.android-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          # Fall back to ci.yml's host build cache to warm the shared deps.
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-v2-

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-release-${{ hashFiles('**/*.gradle.kts', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set up cargo-ndk (for the media APK's Rust cdylib)
        run: |
          # Both ABIs the media app packages (arm64-v8a + armeabi-v7a); the
          # 32-bit target's bindgen path needs libclang, already in the image.
          rustup target add aarch64-linux-android armv7-linux-androideabi
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk
          # cargo-ndk auto-detects the NDK, but pin ANDROID_NDK_HOME explicitly
          # (baked into the android image by `deps install android`).
          ndk="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | head -n1)"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Build .deb
        # `shepherd package deb` builds --release, stages via
        # `DESTDIR=… shepherd install …`, and runs dpkg-deb. Runs as root in the
        # container, so no fakeroot is needed. Output lands in dist/pkg/.
        run: ./scripts/shepherd package deb --out dist/pkg

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHEPHERD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SHEPHERD_KEYSTORE_B64 is not set; cannot produce a signed release APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shepherd-release.jks"

      - name: Build signed release APKs
        env:
          SHEPHERD_KEYSTORE_FILE: ${{ runner.temp }}/shepherd-release.jks
          SHEPHERD_KEYSTORE_PASSWORD: ${{ secrets.SHEPHERD_KEYSTORE_PASSWORD }}
          SHEPHERD_KEY_ALIAS: ${{ secrets.SHEPHERD_KEY_ALIAS }}
          SHEPHERD_KEY_PASSWORD: ${{ secrets.SHEPHERD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          version="$(./scripts/shepherd version)"
          mkdir -p dist/pkg

          # Build one module's release APK and stage it under its release name.
          build_apk() {
            local dir="$1" gmod="$2" artifact="$3"
            echo "::group::assembleRelease $artifact"
            ( cd "$dir" && ./gradlew --no-daemon ":${gmod}:assembleRelease" )
            local apk
            apk="$(find "$dir/$gmod/build/outputs/apk/release" -name '*.apk' | head -n1)"
            [ -n "$apk" ] || { echo "::error::no release APK under $dir/$gmod"; exit 1; }
            cp "$apk" "dist/pkg/${artifact}_${version}.apk"
            echo "::endgroup::"
          }

          # companion: pure Kotlin. media: NativeActivity whose Gradle build
          # cross-compiles a Rust cdylib via cargo-ndk (uses ANDROID_NDK_HOME set
          # above) for both packaged ABIs. Add a line per new Android module.
          build_apk companion-android app shepherd-companion
          build_apk crates/shepherd-media-android/android app shepherd-media

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist/pkg
          sha256sum ./*.deb ./*.apk > SHA256SUMS
          echo "Release assets:"; ls -l

      - name: Dry run — skip release creation
        if: ${{ !(github.event_name == 'push' || github.event.inputs.publish == 'true') }}
        run: |
          echo "Dry run: built the assets above but did NOT create a Forgejo"
          echo "release. Re-run with 'publish' ticked, or push a vX.Y.Z tag."

      - name: Create release and upload assets
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          command -v jq >/dev/null 2>&1 || { apt-get update && apt-get install -y jq; }
          api="${SERVER_URL}/api/v1/repos/${REPO}"
          auth="Authorization: token ${RELEASE_TOKEN}"

          # Create the release for this tag (the tag already exists — the push is
          # what triggered the workflow).
          release_id=$(curl -fsS -X POST "${api}/releases" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg tag "$TAG" \
                    '{tag_name: $tag, name: $tag, draft: false, prerelease: false}')" \
            | jq -r '.id')
          echo "Created release id=$release_id"

          for f in dist/pkg/*; do
            name="$(basename "$f")"
            echo "Uploading $name"
            curl -fsS -X POST "${api}/releases/${release_id}/assets?name=${name}" \
              -H "$auth" -F "attachment=@${f}" >/dev/null
          done
          echo "Published ${TAG}"

name: Release

# Tag-driven release pipeline. Pushing a `vX.Y.Z` tag builds the amd64 `.deb`
# and a signed `.apk` per Android module, then publishes them to a Forgejo
# release with a SHA256SUMS manifest.
#
# Release flow:
#   ./scripts/shepherd version set X.Y.Z
#   git commit -am "bump to X.Y.Z" && git tag -a vX.Y.Z -m vX.Y.Z
#   git push && git push --tags
#
# See docs/ai/history/2026-07-04 003 binary-releases.md for the full design.
#
# Secrets required (in addition to REGISTRY_TOKEN from ci.yml):
#   RELEASE_TOKEN               repo-write PAT used to create the release + upload
#                               assets. (Not FORGEJO_*/GITEA_*/GITHUB_* — Forgejo
#                               reserves those prefixes for secret names.)
#   SHEPHERD_KEYSTORE_B64       base64 of the Android release keystore
#   SHEPHERD_KEYSTORE_PASSWORD  keystore password
#   SHEPHERD_KEY_ALIAS          signing key alias
#   SHEPHERD_KEY_PASSWORD       signing key password

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for a dry run: builds the .deb + both signed .apks and
  # collects them (exercising signing, the media armed cargo-ndk cross-compile,
  # and the artifacts backend) WITHOUT creating a Forgejo release — unless you
  # tick `publish`. Run it from the branch to shake the pipeline out before
  # cutting a real vX.Y.Z tag.
  workflow_dispatch:
    inputs:
      publish:
        description: "Create the Forgejo release + upload assets (off = dry run)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------------------
  # guard: the tag must match the canonical VERSION, and all synced literals
  # must be in harmony (reuses the #83 guarantee). Fails the whole release
  # loudly rather than shipping mismatched artifacts.
  # --------------------------------------------------------------------------
  guard:
    name: Guard (tag == VERSION)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Only meaningful for a tag push; a manual dry run has no vX.Y.Z ref.
      - name: Tag matches VERSION
        if: github.event_name == 'push'
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(./scripts/shepherd version)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME (=$tag_version) does not match VERSION ($file_version)"
            exit 1
          fi
          echo "Releasing version $file_version"

      - name: Version harmony
        run: ./scripts/shepherd version check

  # --------------------------------------------------------------------------
  # images: build-if-missing the pre-baked CI images and expose their refs.
  # Shared with ci.yml via the reusable workflow so the logic isn't duplicated.
  # --------------------------------------------------------------------------
  images:
    name: CI images
    needs: guard
    uses: ./.github/workflows/images.yml
    permissions:
      packages: write
    secrets: inherit

  # --------------------------------------------------------------------------
  # deb: stage the install tree via install.sh (DESTDIR) and dpkg-deb it.
  # --------------------------------------------------------------------------
  deb:
    name: Build .deb (amd64)
    needs: [guard, images]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.base-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-v2-

      - name: Build .deb
        # `shepherd package deb` builds --release, stages via
        # `DESTDIR=… shepherd install …`, generates DEBIAN control + maintainer
        # scripts, and runs dpkg-deb. Output lands in dist/pkg/.
        run: ./scripts/shepherd package deb --out dist/pkg

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/pkg/*.deb
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # apk: one signed APK per Android module. Add a matrix row per new app.
  # --------------------------------------------------------------------------
  apk:
    name: Build .apk (${{ matrix.module.name }})
    needs: [guard, images]
    runs-on: ubuntu-latest
    container:
      image: ${{ needs.images.outputs.android-ref }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REGISTRY_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        module:
          - name: companion
            dir: companion-android
            gradle_module: app
            artifact: shepherd-companion
          # media is a NativeActivity app whose Gradle build cross-compiles a
          # Rust cdylib via cargo-ndk (rust: true gates the extra toolchain
          # setup below). Its Gradle project sits inside the crate.
          - name: media
            dir: crates/shepherd-media-android/android
            gradle_module: app
            artifact: shepherd-media
            rust: true
    steps:
      - uses: actions/checkout@v4

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles(format('{0}/gradle/libs.versions.toml', matrix.module.dir), format('{0}/**/build.gradle.kts', matrix.module.dir)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # Rust-native modules only: the Gradle `assembleRelease` invokes cargo-ndk
      # to cross-compile the cdylib for every ABI in the app's `rustAbis`, so it
      # needs the Android Rust targets, cargo-ndk, and the NDK on PATH. Cache key
      # matches the android-media job in ci.yml so they share the built deps.
      - name: Cache cargo (Rust-native APKs)
        if: matrix.module.rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            target
          key: ${{ runner.os }}-cargo-media-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-media-android-

      - name: Set up cargo-ndk (Rust-native APKs)
        if: matrix.module.rust
        run: |
          # Both ABIs the media app packages (arm64-v8a + armeabi-v7a); the
          # 32-bit target's bindgen path needs libclang, already in the image.
          rustup target add aarch64-linux-android armv7-linux-androideabi
          command -v cargo-ndk >/dev/null || cargo install cargo-ndk
          # cargo-ndk auto-detects the NDK, but pin ANDROID_NDK_HOME explicitly
          # (baked into the android image by `deps install android`).
          ndk="$(ls -d "$ANDROID_SDK_ROOT"/ndk/* | head -n1)"
          echo "ANDROID_NDK_HOME=$ndk" >> "$GITHUB_ENV"

      - name: Decode signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.SHEPHERD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::SHEPHERD_KEYSTORE_B64 is not set; cannot produce a signed release APK"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shepherd-release.jks"

      - name: Assemble signed release APK
        working-directory: ${{ matrix.module.dir }}
        env:
          SHEPHERD_KEYSTORE_FILE: ${{ runner.temp }}/shepherd-release.jks
          SHEPHERD_KEYSTORE_PASSWORD: ${{ secrets.SHEPHERD_KEYSTORE_PASSWORD }}
          SHEPHERD_KEY_ALIAS: ${{ secrets.SHEPHERD_KEY_ALIAS }}
          SHEPHERD_KEY_PASSWORD: ${{ secrets.SHEPHERD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :${{ matrix.module.gradle_module }}:assembleRelease

      - name: Stage APK with release name
        run: |
          src="${{ matrix.module.dir }}/${{ matrix.module.gradle_module }}/build/outputs/apk/release"
          apk="$(find "$src" -name '*.apk' | head -n1)"
          if [ -z "$apk" ]; then
            echo "::error::no release APK found under $src"
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/pkg
          cp "$apk" "dist/pkg/${{ matrix.module.artifact }}_${version}.apk"

      - name: Upload .apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.module.name }}
          path: dist/pkg/*.apk
          if-no-files-found: error

  # --------------------------------------------------------------------------
  # publish: collect all artifacts, checksum, and create the Forgejo release.
  # --------------------------------------------------------------------------
  publish:
    name: Publish / collect
    needs: [deb, apk]
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      # Always runs — in a dry run this still proves the artifacts round-trip
      # (upload in the build jobs, download here) and the checksum manifest.
      - name: Collect assets and checksum
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.deb' -o -name '*.apk' \) -exec cp {} release/ \;
          ( cd release && sha256sum ./* > SHA256SUMS )
          echo "Release assets:"
          ls -l release

      - name: Dry run — skip release creation
        if: ${{ !(github.event_name == 'push' || github.event.inputs.publish == 'true') }}
        run: |
          echo "Dry run: built + collected the assets above but did NOT create a"
          echo "Forgejo release. Re-run with 'publish' ticked, or push a vX.Y.Z tag."

      - name: Create release and upload assets
        if: ${{ github.event_name == 'push' || github.event.inputs.publish == 'true' }}
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          api="${SERVER_URL}/api/v1/repos/${REPO}"
          auth="Authorization: token ${RELEASE_TOKEN}"

          # Create the release for this tag (the tag already exists — this push
          # is what triggered the workflow).
          release_id=$(curl -fsS -X POST "${api}/releases" \
            -H "$auth" -H 'Content-Type: application/json' \
            -d "$(jq -n --arg tag "$TAG" \
                    '{tag_name: $tag, name: $tag, draft: false, prerelease: false}')" \
            | jq -r '.id')
          echo "Created release id=$release_id"

          for f in release/*; do
            name="$(basename "$f")"
            echo "Uploading $name"
            curl -fsS -X POST \
              "${api}/releases/${release_id}/assets?name=${name}" \
              -H "$auth" \
              -F "attachment=@${f}" >/dev/null
          done
          echo "Published ${TAG}"

name: CI images

# Reusable workflow that builds (on content-hash miss) and publishes the
# pre-baked CI images, then exposes their refs as outputs. Called by both
# ci.yml and release.yml via `uses: ./.github/workflows/images.yml` so the
# build-if-missing logic lives in exactly one place.
#
# Requires a `REGISTRY_TOKEN` secret (Forgejo PAT with package read+write);
# callers pass it with `secrets: inherit`. See ci.yml for the DinD/runner
# background these jobs depend on.

on:
  workflow_call:
    outputs:
      base-ref:
        description: Base CI image ref (Rust build/test/lint jobs run in this)
        value: ${{ jobs.image.outputs.ref }}
      android-ref:
        description: Android CI image ref (JDK + Android SDK layered on base)
        value: ${{ jobs.image-android.outputs.ref }}
      cross-ref:
        description: >-
          arm64 cross CI image ref (cross toolchain + arm64 sysroot layered on
          base). Only the arm64 build/package jobs pull this; it is 1.5-2.5 GB
          larger than the base.
        value: ${{ jobs.image-cross.outputs.ref }}

jobs:
  image:
    name: CI image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    # Job-level, not workflow-level: Forgejo's runner does not propagate a
    # reusable workflow's top-level `env:` into its jobs, which silently blanked
    # CI_IMAGE_NAME and produced an invalid `:tag`-only image ref.
    env:
      CI_IMAGE_NAME: git.armeafamily.com/albert/shepherd-launcher-ci
    steps:
      - name: Install docker CLI
        # The default `runs-on: ubuntu-latest` job container
        # (node:20-bookworm) has git but no docker CLI. Install
        # docker.io so we can talk to the DinD daemon.
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        # The runner is configured with
        # `container.docker_host: tcp://docker:2375`, which auto-
        # provisions a docker:dind sidecar. The hostname `docker`
        # only resolves on the docker-compose network the runner
        # lives on — but job containers are children of the dind
        # service and live on dind's own bridge network, where
        # `docker` doesn't resolve. The dind daemon is reachable
        # from a job container at the bridge gateway IP (which is
        # the dind container itself, listening on 0.0.0.0:2375
        # because the compose env sets DOCKER_TLS_CERTDIR="").
        # `iproute2` was just pulled in as a transitive dep of the
        # docker.io install above, so `ip route` is on PATH.
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          # Strict hash over the inputs that determine image content.
          # Year+week prefix forces a weekly rebuild so distro security
          # updates roll in even when no input file has changed.
          hash=$(cat \
              .ci/Dockerfile \
              scripts/deps/build.pkgs \
              scripts/deps/run.pkgs \
              scripts/deps/test.pkgs \
              scripts/lib/deps.sh \
            | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Wait for DinD daemon
        # Even after the sidecar is up, the daemon can take a few
        # seconds before it answers requests. Poll until ready.
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon at $DOCKER_HOST never became ready."
          echo "::error::Confirm the runner has container.docker_host: tcp://docker:2375 set"
          echo "::error::and a docker:dind sidecar reachable from job containers."
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          docker build -t "$ref" -f .ci/Dockerfile .
          docker push "$ref"

  image-android:
    name: CI image (Android)
    # Layers the JDK + Android SDK onto the base CI image so the
    # companion-android Gradle job gets a ready ~1 GB SDK without every
    # Rust-only job paying the pull. Same build-push-on-hash-miss shape
    # as the base `image` job above; see .ci/Dockerfile.android.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    # See the note on the base image job: job-level env so CI_IMAGE_NAME
    # survives inside the reusable workflow.
    env:
      CI_IMAGE_NAME: git.armeafamily.com/albert/shepherd-launcher-ci
    steps:
      - name: Install docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          # Hash the Android-layer inputs plus the base image ref. The
          # base ref already encodes the base Dockerfile + deps hashes,
          # so folding it in rebuilds this image whenever the base does
          # or the SDK inputs change. Year+week prefix keeps the weekly
          # security-update rebuild.
          hash=$( { cat \
                .ci/Dockerfile.android \
                scripts/deps/android.pkgs \
                scripts/lib/deps.sh; \
              printf '%s' "$BASE_REF"; \
            } | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}-android:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Wait for DinD daemon
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon at $DOCKER_HOST never became ready."
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          # Pull the base image explicitly so the dind daemon has it
          # locally for the FROM (it may not be in the daemon's cache).
          docker pull "$BASE_REF"
          docker build \
            --build-arg BASE_IMAGE="$BASE_REF" \
            -t "$ref" -f .ci/Dockerfile.android .
          docker push "$ref"

  image-cross:
    name: CI image (arm64 cross)
    # Layers the cross toolchain + arm64 sysroot onto the base CI image so the
    # arm64 build and package jobs get a ready multiarch sysroot. Kept separate
    # from the base image because that set is 1.5-2.5 GB and every other job
    # pulls the base on every run. Same build-push-on-hash-miss shape as the
    # two jobs above; see .ci/Dockerfile.cross.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    # See the note on the base image job: job-level env so CI_IMAGE_NAME
    # survives inside the reusable workflow.
    env:
      CI_IMAGE_NAME: git.armeafamily.com/albert/shepherd-launcher-ci
      TARGET_ARCH: arm64
    steps:
      - name: Install docker CLI
        run: |
          apt-get update
          apt-get install -y docker.io

      - name: Point DOCKER_HOST at the DinD bridge gateway
        run: |
          gateway=$(ip route | awk '$1=="default"{print $3; exit}')
          if [ -z "$gateway" ]; then
            echo "::error::could not determine bridge gateway IP"
            ip route || true
            exit 1
          fi
          echo "DOCKER_HOST=tcp://${gateway}:2375" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=tcp://${gateway}:2375"

      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          # Hash the cross-layer inputs plus the base image ref. cross.pkgs and
          # Dockerfile.cross must be in here or a dependency change would not
          # trigger a rebuild; the base ref folds in the base Dockerfile + deps
          # hashes, so a base rebuild forces this one too. TARGET_ARCH is in
          # the hash because it changes what the layer installs. Year+week
          # prefix keeps the weekly security-update rebuild.
          hash=$( { cat \
                .ci/Dockerfile.cross \
                scripts/deps/cross.pkgs \
                scripts/lib/deps.sh; \
              printf '%s%s' "$BASE_REF" "$TARGET_ARCH"; \
            } | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}-cross-${TARGET_ARCH}:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Wait for DinD daemon
        run: |
          for _ in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "docker daemon ready at $DOCKER_HOST"
              exit 0
            fi
            sleep 1
          done
          echo "::error::docker daemon at $DOCKER_HOST never became ready."
          exit 1

      - name: Log in to Forgejo container registry
        run: |
          echo "${{ secrets.REGISTRY_TOKEN }}" \
            | docker login git.armeafamily.com \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          # Pull the base image explicitly so the dind daemon has it locally
          # for the FROM (it may not be in the daemon's cache).
          docker pull "$BASE_REF"
          docker build \
            --build-arg BASE_IMAGE="$BASE_REF" \
            --build-arg TARGET_ARCH="$TARGET_ARCH" \
            -t "$ref" -f .ci/Dockerfile.cross .
          docker push "$ref"

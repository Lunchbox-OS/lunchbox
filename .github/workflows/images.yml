name: CI images

# Reusable workflow that builds (on content-hash miss) and publishes the
# pre-baked CI images, then exposes their refs as outputs. Called by both
# ci.yml and release.yml via `uses: ./.github/workflows/images.yml` so the
# build-if-missing logic lives in exactly one place.
#
# Publishes to GHCR (ghcr.io/aarmea/lunchbox-ci*). `permissions: packages:
# write` plus the ambient GITHUB_TOKEN covers both build and push, so no PAT is
# needed -- on Forgejo a `REGISTRY_TOKEN` was, because that registry 401'd the
# ambient token on push.

on:
  workflow_call:
    outputs:
      base-ref:
        description: Base CI image ref (Rust build/test/lint jobs run in this)
        value: ${{ jobs.image.outputs.ref }}
      android-ref:
        description: Android CI image ref (JDK + Android SDK layered on base)
        value: ${{ jobs.image-android.outputs.ref }}
      cross-ref:
        description: >-
          arm64 cross CI image ref (cross toolchain + arm64 sysroot layered on
          base). Only the arm64 build/package jobs pull this; it is 1.5-2.5 GB
          larger than the base.
        value: ${{ jobs.image-cross.outputs.ref }}

jobs:
  image:
    name: CI image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    # Job-level, not workflow-level: Forgejo's runner did not propagate a
    # reusable workflow's top-level `env:` into its jobs, which silently blanked
    # CI_IMAGE_NAME and produced an invalid `:tag`-only image ref. GitHub does
    # propagate it; kept job-level so the two forges behave identically.
    env:
      CI_IMAGE_NAME: ghcr.io/aarmea/lunchbox-ci
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        run: |
          # Strict hash over the inputs that determine image content.
          # Year+week prefix forces a weekly rebuild so distro security
          # updates roll in even when no input file has changed.
          hash=$(cat \
              .ci/Dockerfile \
              scripts/deps/build.pkgs \
              scripts/deps/run.pkgs \
              scripts/deps/test.pkgs \
              scripts/lib/deps.sh \
            | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Log in to GHCR
        # GITHUB_TOKEN with `packages: write` is enough for ghcr.io, so this
        # needs no PAT. On Forgejo it did: that instance authenticated the
        # ambient token for read but 401'd on push.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          docker build -t "$ref" -f .ci/Dockerfile .
          docker push "$ref"

  image-android:
    name: CI image (Android)
    # Layers the JDK + Android SDK onto the base CI image so the
    # companion-android Gradle job gets a ready ~1 GB SDK without every
    # Rust-only job paying the pull. Same build-push-on-hash-miss shape
    # as the base `image` job above; see .ci/Dockerfile.android.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    # See the note on the base image job: job-level env so CI_IMAGE_NAME
    # survives inside the reusable workflow.
    env:
      CI_IMAGE_NAME: ghcr.io/aarmea/lunchbox-ci
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          # Hash the Android-layer inputs plus the base image ref. The
          # base ref already encodes the base Dockerfile + deps hashes,
          # so folding it in rebuilds this image whenever the base does
          # or the SDK inputs change. Year+week prefix keeps the weekly
          # security-update rebuild.
          hash=$( { cat \
                .ci/Dockerfile.android \
                scripts/deps/android.pkgs \
                scripts/lib/deps.sh; \
              printf '%s' "$BASE_REF"; \
            } | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}-android:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Log in to GHCR
        # GITHUB_TOKEN with `packages: write` is enough for ghcr.io, so this
        # needs no PAT. On Forgejo it did: that instance authenticated the
        # ambient token for read but 401'd on push.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          # Pull the base image explicitly so the daemon has it locally for
          # the FROM (it may not be in the daemon's cache).
          docker pull "$BASE_REF"
          docker build \
            --build-arg BASE_IMAGE="$BASE_REF" \
            -t "$ref" -f .ci/Dockerfile.android .
          docker push "$ref"

  image-cross:
    name: CI image (arm64 cross)
    # Layers the cross toolchain + arm64 sysroot onto the base CI image so the
    # arm64 build and package jobs get a ready multiarch sysroot. Kept separate
    # from the base image because that set is 1.5-2.5 GB and every other job
    # pulls the base on every run. Same build-push-on-hash-miss shape as the
    # two jobs above; see .ci/Dockerfile.cross.
    needs: image
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    # See the note on the base image job: job-level env so CI_IMAGE_NAME
    # survives inside the reusable workflow.
    env:
      CI_IMAGE_NAME: ghcr.io/aarmea/lunchbox-ci
      TARGET_ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: tag
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          # Hash the cross-layer inputs plus the base image ref. cross.pkgs and
          # Dockerfile.cross must be in here or a dependency change would not
          # trigger a rebuild; the base ref folds in the base Dockerfile + deps
          # hashes, so a base rebuild forces this one too. TARGET_ARCH is in
          # the hash because it changes what the layer installs. Year+week
          # prefix keeps the weekly security-update rebuild.
          hash=$( { cat \
                .ci/Dockerfile.cross \
                scripts/deps/cross.pkgs \
                scripts/lib/deps.sh; \
              printf '%s%s' "$BASE_REF" "$TARGET_ARCH"; \
            } | sha256sum | cut -c1-12)
          year_week=$(date -u +%Gw%V)
          ref="${CI_IMAGE_NAME}-cross-${TARGET_ARCH}:${year_week}-${hash}"
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Image ref: ${ref}"

      - name: Log in to GHCR
        # GITHUB_TOKEN with `packages: write` is enough for ghcr.io, so this
        # needs no PAT. On Forgejo it did: that instance authenticated the
        # ambient token for read but 401'd on push.
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | docker login ghcr.io \
                --username "${{ github.actor }}" --password-stdin

      - name: Build and push if tag is missing
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
        run: |
          ref="${{ steps.tag.outputs.ref }}"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "Image already published: $ref"
            exit 0
          fi
          # Pull the base image explicitly so the daemon has it locally for
          # the FROM (it may not be in the daemon's cache).
          docker pull "$BASE_REF"
          docker build \
            --build-arg BASE_IMAGE="$BASE_REF" \
            --build-arg TARGET_ARCH="$TARGET_ARCH" \
            -t "$ref" -f .ci/Dockerfile.cross .
          docker push "$ref"

  settle:
    name: CI images (settle outputs)
    # Deliberately the last job in this workflow, so that it -- and not an
    # image job -- is the one that finishes in the same instant the caller does.
    #
    # Forgejo resolves this reusable workflow's `outputs:` once, when the caller
    # job (`CI images` in ci.yml and release.yml) completes, and stores the
    # result; every downstream job reads that stored value, however much later
    # it runs. When the last image job finished in the same second as the caller,
    # its output was missing from that snapshot. Run 462 lost the cross ref that
    # way: `CI image (arm64 cross)` succeeded at 20:24:45, `CI images` completed
    # at 20:24:45 with an empty `cross-ref`, and five minutes later `Package
    # (arm64)` still read it empty. Its log shows the consequence -- `Start
    # image=…-ci:…`, the base image, because `arm64 && cross-ref || base-ref`
    # falls through on an empty string -- and `Build (arm64 cross)` started
    # `node:20-bookworm`, the runner default, with no container at all.
    #
    # With this job last, the image jobs' outputs are persisted a whole job
    # (scheduling, container start, one step) before the snapshot is taken. It
    # exposes no outputs of its own, so if the snapshot ever races *it*, nothing
    # is lost. The arm64 jobs' own "Assert this job got the arm64 cross image"
    # step remains the backstop.
    needs: [image, image-android, image-cross]
    runs-on: ubuntu-latest
    steps:
      - name: Show the refs this workflow will hand to its caller
        # Also a diagnostic: if a ref is non-empty here but a downstream job
        # still receives it empty, the snapshot is not the (only) cause.
        env:
          BASE_REF: ${{ needs.image.outputs.ref }}
          ANDROID_REF: ${{ needs.image-android.outputs.ref }}
          CROSS_REF: ${{ needs.image-cross.outputs.ref }}
        run: |
          echo "base-ref:    '$BASE_REF'"
          echo "android-ref: '$ANDROID_REF'"
          echo "cross-ref:   '$CROSS_REF'"

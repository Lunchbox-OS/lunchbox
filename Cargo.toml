[workspace]
resolver = "2"
members = [
    "crates/shepherd-util",
    "crates/shepherd-api",
    "crates/shepherd-host-api",
    "crates/shepherd-config",
    "crates/shepherd-firewall-helper",
    "crates/shepherd-store",
    "crates/shepherd-core",
    "crates/shepherd-host-linux",
    "crates/shepherd-ipc",
    "crates/shepherd-management",
    "crates/shepherd-management-macros",
    "crates/shepherd-http",
    "crates/shepherd-ble",
    "crates/shepherdd",
    "crates/shepherd-state-proto",
    "crates/shepherd-stated",
    "crates/shepherd-launcher-ui",
    "crates/shepherd-hud",
    "crates/shepherd-pairing-display",
    "crates/shepherd-e2e",
    "crates/shepherd-media-core",
    "crates/shepherd-media-app",
    "crates/shepherd-media-cache",
    "crates/shepherd-media-ui",
    "crates/shepherd-media-android",
    "crates/shepherd-media",
    "crates/shepherd-bridge",
    "crates/shepherd-touch-bridge",
    "crates/shepherd-tablet-bridge",
    "crates/shepherd-gamepad-bridge",
    "crates/shepherd-wire-codegen",
    "crates/shepherd-config-wasm",
]
# Everything except the codegen and wasm crates. `cargo build` at the repo root
# must not build shepherd-wire-codegen, because doing so would unify its
# `schema` feature into shepherd-api and compile schemars into shepherdd and
# the launcher; shepherd-config-wasm is out for the same reason, so a plain
# build never reaches wasm-bindgen. Use `-p <crate>` (or `--workspace`, as the
# tests do) to reach either deliberately.
default-members = [
    "crates/shepherd-util",
    "crates/shepherd-api",
    "crates/shepherd-host-api",
    "crates/shepherd-config",
    "crates/shepherd-firewall-helper",
    "crates/shepherd-store",
    "crates/shepherd-core",
    "crates/shepherd-host-linux",
    "crates/shepherd-ipc",
    "crates/shepherd-management",
    "crates/shepherd-management-macros",
    "crates/shepherd-http",
    "crates/shepherd-ble",
    "crates/shepherdd",
    "crates/shepherd-state-proto",
    "crates/shepherd-stated",
    "crates/shepherd-launcher-ui",
    "crates/shepherd-hud",
    "crates/shepherd-pairing-display",
    "crates/shepherd-e2e",
    "crates/shepherd-media-core",
    "crates/shepherd-media-app",
    "crates/shepherd-media-cache",
    "crates/shepherd-media-ui",
    "crates/shepherd-media-android",
    "crates/shepherd-media",
    "crates/shepherd-bridge",
    "crates/shepherd-touch-bridge",
    "crates/shepherd-tablet-bridge",
    "crates/shepherd-gamepad-bridge",
]
# shepherd-firewall-bpf targets bpfel-unknown-none on nightly and is built
# separately by shepherd-firewall-helper's build.rs (via aya-build). Excluded
# so `cargo build` doesn't try to compile it for the host target.
exclude = ["crates/shepherd-firewall-bpf"]

[workspace.package]
# Canonical version lives in the repo-root VERSION file; Cargo can't read it at
# parse time, so this literal is written by `shepherd version set` and verified
# by `shepherd version check` (run in CI). Don't hand-edit — bump via the tool.
version = "0.5.0"
edition = "2024"
license = "GPL-3.0"
authors = ["Albert Armea"]
repository = "https://github.com/aarmea/shepherd-launcher"

[workspace.dependencies]
# Internal crates
shepherd-util = { path = "crates/shepherd-util" }
shepherd-api = { path = "crates/shepherd-api" }
shepherd-host-api = { path = "crates/shepherd-host-api" }
shepherd-config = { path = "crates/shepherd-config" }
shepherd-store = { path = "crates/shepherd-store" }
shepherd-core = { path = "crates/shepherd-core" }
shepherd-host-linux = { path = "crates/shepherd-host-linux" }
shepherd-ipc = { path = "crates/shepherd-ipc" }
shepherd-state-proto = { path = "crates/shepherd-state-proto" }
shepherd-stated = { path = "crates/shepherd-stated" }
shepherd-management = { path = "crates/shepherd-management" }
shepherd-management-macros = { path = "crates/shepherd-management-macros" }
shepherd-http = { path = "crates/shepherd-http" }
shepherd-ble = { path = "crates/shepherd-ble" }
shepherd-bridge = { path = "crates/shepherd-bridge" }
shepherd-wire-codegen = { path = "crates/shepherd-wire-codegen" }
shepherd-config-wasm = { path = "crates/shepherd-config-wasm" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
# JSON Schema for the wire types, from which the companion's Kotlin
# mirrors are generated (see crates/shepherd-management/src/bin/rpc_codegen.rs).
schemars = { version = "1", features = ["chrono04", "uuid1"] }

# Async runtime
tokio = { version = "1.35", features = ["full", "signal"] }

# D-Bus (system bus signals: logind suspend/resume, NetworkManager state).
# tokio feature so it runs on the existing tokio runtime instead of async-io.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
# The `log` feature makes `tracing` emit `log` records when no tracing
# Subscriber is installed, so the Android binaries — which set up
# `android_logger` rather than `tracing-subscriber` — still see events from
# shared crates (e.g. shepherd-media-core reporting the chosen hwdec).
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# The bare `log` facade, for crates shared with the Android build that only need
# to emit a record: `tracing-subscriber`'s `tracing-log` bridge picks these up on
# Linux, `android_logger` does on Android.
log = "0.4"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
bitflags = "2.4"

# Unix-specific
nix = { version = "0.29", features = ["signal", "process", "user", "socket"] }

# File watching
notify = "6"

# Input device enumeration (evdev). Shared with the input-compat bridges,
# which pin the same version directly.
evdev = "0.13"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# GTK4 UI
# `v4_10` unlocks `gtk_widget_get_color`, which the HUD's analog clock face
# needs to draw itself in the colour CSS resolved for it rather than carrying a
# second copy of the palette (issue #171). The feature only gates which
# bindings are compiled; shepherd already requires Ubuntu 26.04 (GTK 4.18+),
# well past the 4.10 it asks for, so it cannot raise the bar.
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk4-layer-shell = "0.4"

# HTTP API
axum = { version = "0.8", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
# TLS termination for the management API (issue #156). `rustls` is already in
# the tree behind `ureq`, on the `ring` provider; both of these follow it there
# rather than dragging in `aws-lc-rs`, which wants cmake and a C toolchain on a
# device that has neither.
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pemfile = "2"

# Password hashing for the web UI login (issue #156). Argon2id with the
# crate's default params; the PHC string carries them, so raising them later
# re-hashes on next login rather than invalidating the stored password.
argon2 = "0.5"
# CSPRNG behind session ids, enrolment codes and approval codes.
rand = "0.8"
# Constant-time comparison of session tokens and codes.
subtle = "2.6"
sha2 = "0.10"
# User-Agent parsing, for the label beside each session in the "signed-in
# browsers" list (issue #156). A hand-rolled token table kept mislabelling
# ordinary devices -- every browser on iOS is WebKit and announces itself as
# `CriOS`/`FxiOS`/`EdgiOS`, ChromeOS says `CrOS` and never `Linux` -- and the
# set of such rules is exactly the kind that goes stale unnoticed. Self
# contained: the dataset is compiled in, so there is no regex file to vendor
# or refresh, unlike `ua-parser`, and no `serde_yaml` (deprecated) as
# `uaparser` would bring. Output is a label a person reads, never an input to
# a decision.
woothee = "0.13"

# WebSocket client (Steam CEF DevTools / Chrome DevTools Protocol).
# Default features give a non-TLS ws:// client; we only talk to loopback.
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Testing
tempfile = "3.9"

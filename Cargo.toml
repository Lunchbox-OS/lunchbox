[workspace]
resolver = "2"
members = [
    "crates/shepherd-util",
    "crates/shepherd-api",
    "crates/shepherd-host-api",
    "crates/shepherd-config",
    "crates/shepherd-firewall-helper",
    "crates/shepherd-store",
    "crates/shepherd-core",
    "crates/shepherd-host-linux",
    "crates/shepherd-ipc",
    "crates/shepherd-http",
    "crates/shepherdd",
    "crates/shepherd-launcher-ui",
    "crates/shepherd-hud",
    "crates/shepherd-e2e",
    "crates/shepherd-media-core",
    "crates/shepherd-media",
    "crates/shepherd-bridge",
    "crates/shepherd-keyboard-core",
    "crates/shepherd-touch-bridge",
    "crates/shepherd-tablet-bridge",
    "crates/shepherd-gamepad-bridge",
]
# shepherd-firewall-bpf targets bpfel-unknown-none on nightly and is built
# separately by shepherd-firewall-helper's build.rs (via aya-build). Excluded
# so `cargo build` doesn't try to compile it for the host target.
exclude = ["crates/shepherd-firewall-bpf"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
authors = ["Albert Armea"]
repository = "https://github.com/aarmea/shepherd-launcher"

[workspace.dependencies]
# Internal crates
shepherd-util = { path = "crates/shepherd-util" }
shepherd-api = { path = "crates/shepherd-api" }
shepherd-host-api = { path = "crates/shepherd-host-api" }
shepherd-config = { path = "crates/shepherd-config" }
shepherd-store = { path = "crates/shepherd-store" }
shepherd-core = { path = "crates/shepherd-core" }
shepherd-host-linux = { path = "crates/shepherd-host-linux" }
shepherd-ipc = { path = "crates/shepherd-ipc" }
shepherd-http = { path = "crates/shepherd-http" }
shepherd-bridge = { path = "crates/shepherd-bridge" }
shepherd-keyboard-core = { path = "crates/shepherd-keyboard-core" }

# Swipe-typing decoder (external, host-agnostic). Pinned to a signed release tag;
# consumes downloaded signed bundles (see scripts/fetch-swipe-bundles.sh). The crate
# verifies each bundle's minisign signature + per-file hashes on load.
shepherd-swipe-core = { git = "https://git.armeafamily.com/albert/shepherd-swipe", tag = "v0.1.0" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Async runtime
tokio = { version = "1.35", features = ["full", "signal"] }

# D-Bus (system bus signals: logind suspend/resume, NetworkManager state).
# tokio feature so it runs on the existing tokio runtime instead of async-io.
zbus = { version = "5", default-features = false, features = ["tokio"] }

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
uuid = { version = "1.6", features = ["v4", "serde"] }
bitflags = "2.4"

# Unix-specific
nix = { version = "0.29", features = ["signal", "process", "user", "socket"] }

# File watching
notify = "6"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# GTK4 UI
gtk4 = "0.9"
gtk4-layer-shell = "0.4"

# HTTP API
axum = { version = "0.8", features = ["macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# WebSocket client (Steam CEF DevTools / Chrome DevTools Protocol).
# Default features give a non-TLS ws:// client; we only talk to loopback.
tokio-tungstenite = "0.24"
futures-util = "0.3"

# Testing
tempfile = "3.9"

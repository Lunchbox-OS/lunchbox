# Shepherd Launcher - Kiosk Mode Sway Configuration
# This config makes Sway act as a kiosk environment with a custom launcher

# Set up GNOME Keyring for secrets management if available
exec_always sh -lc 'command -v gnome-keyring-daemon >/dev/null && gnome-keyring-daemon --start --components=secrets >/dev/null 2>&1 || true'

# Update environment variables for D-Bus and GNOME Keyring
exec_always dbus-update-activation-environment --systemd \
    SSH_AUTH_SOCK GNOME_KEYRING_CONTROL WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE XDG_SESSION_DESKTOP XDG_RUNTIME_DIR

### Variables
set $launcher ./target/debug/shepherd-launcher
set $hud ./target/debug/shepherd-hud
set $stop_current $launcher --stop-current

### Output configuration
# Set up displays (adjust as needed for your hardware)
output * bg #000000 solid_color

# Site-local overrides: drop a file here for per-machine display tweaks
# (e.g. HiDPI scale `output * scale 2`) without it being clobbered by
# `shepherd install sway-config`. Sway treats an empty glob as a no-op.
include /etc/sway/shepherd.conf.d/*.conf

# Hide ALL window borders and focus indicators by making them transparent/black
# Note: The 5th value is the "child_border" which is the actual visible border
# Text color (3rd value) is also black to make title/tab text invisible (black on black)
client.focused          #000000 #000000 #000000 #000000 #000000
client.focused_inactive #000000 #000000 #000000 #000000 #000000
client.unfocused        #000000 #000000 #000000 #000000 #000000
client.urgent           #000000 #000000 #000000 #000000 #000000
client.placeholder      #000000 #000000 #000000 #000000 #000000
client.background       #000000

# Completely hide focus indicator by hiding the mark
hide_edge_borders --i3 both

### Idle configuration
# swayidle still owns the timer — it is what notices nobody has touched the
# device — but the blanking goes through shepherdd (issue #144). `swaymsg` here
# used to work; once the compositor socket lost its name it could not connect,
# and because nothing checks a swayidle command's exit status the screen simply
# stopped blanking with no error anywhere.
#
# `--screen-off` also absorbs the old `--is-idle-allowed` gate. That was a
# second process, and a launch landing between its answer and the blank turned
# the screen off on a child mid-activity; shepherdd now checks and acts at once.
exec swayidle -w \
    timeout 120 '$launcher --screen-off' \
    resume '$launcher --screen-on'

### Input configuration
# Disable touchpad/mouse acceleration if needed
input type:pointer {
    accel_profile flat
}

### Key bindings - HEAVILY RESTRICTED for kiosk mode

# Disable ALL default Sway keybindings by not setting a modifier
# This prevents users from opening terminals, switching workspaces, etc.

# Disable TTY switching (Ctrl+Alt+F1-F12)
# This is handled by disabling VT switching at the kernel/systemd level
# Add this to kernel parameters: vt.handoff=0
# Or in /etc/systemd/logind.conf: NAutoVTs=0 and ReserveVT=0

# Exit keybinding - works for both nested sway (dev) and production logout
# In dev: exits the nested sway instance
# In production: logs out of the session (REMOVE or change to something harder to press)
#
# SIGTERM is enough on its own: shepherdd's shutdown stops every session and
# then asks the compositor to exit over its own IPC connection. The second half
# is only the fallback for when shepherdd is not running to be asked, which is
# why it is `||` rather than `&&`.
#
# `swaymsg exit` is that fallback in development only. On a device, where
# hardening is left at its default, the compositor's socket has no name any more
# (issue #144), so a `swaymsg` here could not connect — which left this escape
# hatch dead in precisely the case it exists for. `shepherd install sway-config`
# rewrites it to `loginctl terminate-session "$XDG_SESSION_ID"`, the same
# rewrite it applies to the shepherdd exec line; the note there says why the
# development config keeps `swaymsg`.
bindsym Mod4+Shift+Escape exec pkill -TERM shepherdd || swaymsg exit

### Window rules for kiosk behavior

# Shepherd HUD should always be visible on top (likely uses layer-shell protocol)
# Layer shell surfaces are automatically handled by sway and don't need window rules

# Make launcher windows fullscreen (launcher doesn't need to respect HUD)
for_window [app_id="shepherd-launcher"] fullscreen enable

# Prevent apps from requesting fullscreen (except launcher)
# This catches apps that try to go fullscreen and forces them to respect the HUD
for_window [app_id="^(?!shepherd-launcher$).*"] fullscreen disable
for_window [class=".*"] fullscreen disable

# Make other windows maximize to fill available space (respecting HUD exclusive zone)
# Windows will respect layer-shell exclusive zones rather than going true fullscreen
for_window [class=".*"] border none, title_format ""
for_window [app_id=".*"] border none, title_format ""

# External-monitor mirroring (issue #87): shepherdd runs `wl-mirror` to clone the
# primary panel onto a docked display, since sway/wlroots cannot mirror from
# config. Allow its window to go fullscreen on the external output (it is
# infrastructure, like the HUD — not a launchable activity). This rule is placed
# AFTER the negative-lookahead `fullscreen disable` above so it wins at map time;
# shepherdd additionally pins it to the external output imperatively. `smart`
# activation (below) keeps it from stealing focus from the primary workspace, so
# the one-activity-at-a-time invariant holds.
for_window [app_id="at.yrlf.wl_mirror"] fullscreen enable, border none

# Minecraft Launcher (Electron app) and Minecraft Java Edition (game)
# Launcher: class="Minecraft Launcher" instance="minecraft-launcher"
# Game: class="Minecraft 1.21.11" instance="Minecraft 1.21.11" (version varies)
# We add "focus" to ensure the window gets focus when it appears
for_window [class="^Minecraft [0-9]"] border none, focus
for_window [instance="^Minecraft [0-9]"] border none, focus
for_window [class="^Minecraft Launcher$"] border none
for_window [instance="^minecraft-launcher$"] border none

# Disable window decorations (no title bars) - for all windows
default_border none
default_floating_border none

# Force pixel border of 0 explicitly
default_border pixel 0
default_floating_border pixel 0

# Force no border on XWayland windows
for_window [shell="xwayland"] border none, border pixel 0

# Tell clients not to draw their own decorations (for apps that respect this)
# Note: Many Electron apps ignore this
titlebar_border_thickness 0
titlebar_padding 0 0

# Disable gaps
gaps inner 0
gaps outer 0

# Use stacking layout - windows stack on top of each other (focused one visible)
# This avoids tiling side-by-side while also avoiding tabbed's window switcher
workspace_layout stacking
focus_follows_mouse no

# Hide any title/tab text by using minimal font size
font pango:monospace 1

# Session stop keybindings via shepherdd API (does not close windows directly)
# Handled in sway so they work regardless of which client currently has focus.
bindsym --locked Alt+F4 exec $stop_current
bindsym --locked Ctrl+w exec $stop_current
bindsym --locked Home exec $stop_current

# Volume keys via shepherdd so the configured min/max/allow_mute policy is
# enforced. The launcher CLI is a one-shot that sends a single IPC command;
# shepherdd broadcasts VolumeChanged so the HUD stays in sync.
bindsym --locked XF86AudioRaiseVolume exec $launcher --volume-up
bindsym --locked XF86AudioLowerVolume exec $launcher --volume-down
bindsym --locked XF86AudioMute exec $launcher --toggle-mute

# Brightness keys go through the same path: shepherdd applies the
# min/max policy and broadcasts BrightnessChanged so the HUD slider tracks
# the hardware key. No-op on hosts without a backlight.
bindsym --locked XF86MonBrightnessUp exec $launcher --brightness-up
bindsym --locked XF86MonBrightnessDown exec $launcher --brightness-down

# Hide mouse cursor after inactivity
seat * hide_cursor 5000

### Workspace configuration

# Use only one workspace for true kiosk mode
workspace 1 output *

### Application startup

# Start shepherdd FIRST - it needs to create the socket before HUD/launcher connect
# Running inside sway ensures all spawned processes use the nested compositor
# Shepherdd handles SIGHUP for graceful shutdown when sway exits
# If shepherdd fails to start (e.g., config error), exit sway to prevent a broken state
#
# shepherdd unlinks sway's IPC socket once it has connected (issue #144), so no
# activity can reach the compositor. The development exec line opts out of that
# with `--no-harden-sway-ipc`, because the unlink would take the socket away
# from `swaymsg`, `dev tree`, and anything else driving the session — including,
# if this is ever run outside a nested sway, the developer's own desktop.
#
# `--no-restrict-ipc-peers` opts out of the other half of #144: shepherdd
# otherwise accepts a client on its own management socket only from its own
# cgroup. On a device that cgroup is the display manager's session scope, which
# no activity can join. Here it is whatever shell started this, so a client run
# from any *other* terminal would be refused — and the whole stack shares one
# cgroup anyway, which makes the check meaningless rather than strict.
#
# Deliberately *not* `--trust-environment`. That is the other half of what
# `--no-restrict-ipc-peers` used to mean, split out because they are different
# risks wanted at different times: one decides who may drive the daemon, the
# other decides which binaries the daemon runs. Only the e2e suite needs the
# second, because it stubs `flatpak`/`pkcheck`/`pkexec` on `$PATH`. Leaving it
# off here means a dev session resolves helpers from the same trusted
# directories a device does, so that path is exercised rather than only unit
# tested.
#
# `--no-state-custodian` opts out of #157: shepherdd otherwise asks
# `shepherd-stated` for its policy and state, which live at a uid no activity
# has. A dev box has no custodian installed and no kiosk session for one to
# trust, so without this every dev run would fall back with a `Critical`
# diagnostic raised — true, but noise rather than news on a developer's machine.
#
# `|| swaymsg exit` is the *development* fallback, and it works here only
# because `--no-harden-sway-ipc` above leaves the compositor socket in place.
# On a device shepherdd unlinks that socket once it has connected, so `swaymsg`
# has nothing to connect to and a daemon that dies afterwards would leave sway
# running with nothing supervising it (issue #144's open defect 2).
# `shepherd install sway-config` therefore rewrites this half of the line to
# `loginctl terminate-session "$XDG_SESSION_ID"`, which needs no compositor
# socket and no privilege beyond the kiosk user's own session.
#
# It stays `swaymsg exit` *here* because a development sway is nested inside
# the developer's own login session and inherits its `XDG_SESSION_ID` —
# terminating that would log the developer out, or kill the ssh session running
# the headless harness.
#
# What this does not close (issue #172): the `sh -c` wrapper that observes the
# daemon runs at the kiosk uid, like every activity. An activity that kills the
# wrapper *before* shepherdd leaves nothing to run the fallback, and the session
# stays up unsupervised exactly as it does today. This turns a crash and a
# casual `kill` into a torn-down session; it does not stop a deliberate one.
# Closing that needs a watcher the child cannot signal — the state custodian is
# at its own uid and already tracks the session (#157), but ending a session
# from there is authority it does not have today.

# `shepherd install sway-config` strips all four and rewrites the fallback,
# so a device gets the defaults.
exec sh -c './target/debug/shepherdd -c ./config.example.toml --no-harden-sway-ipc --no-restrict-ipc-peers --no-state-custodian || swaymsg exit'

# Give shepherdd a moment to initialize, then start UI components
# Start the shepherd-hud (time remaining overlay)
exec sleep 1 && $hud

# Start the shepherd-launcher on startup (the main "home" screen)
# Small delay to ensure shepherdd is ready
exec_always sleep 1 && $launcher

### Disable workspace switching
# No keybindings defined = no switching possible

### Status bar - DISABLED for kiosk mode
# bar {
#     position top
# }

### Additional security measures

# Disable Xwayland if not needed (prevents X11 escape hatches)
# xwayland disable

# Prevent floating windows from staying floating - make them tiled
# This ensures they respect the HUD's exclusive zone
for_window [floating] floating disable

# Steam: Hide Steam client windows that appear before the actual game launches.
# Steam is preloaded with -silent so it should not show windows, but as defense-in-depth
# we move any Steam client windows to the scratchpad (fully hidden, never rendered).
# These rules must be AFTER `for_window [floating] floating disable` so that the
# scratchpad move (which makes the window floating) is not undone by that rule.
# Game windows launched by Steam have different class names and are not affected.
for_window [class="^[Ss]team$"] move scratchpad
for_window [instance="^[Ss]team$"] move scratchpad
for_window [title="^Steam$"] move scratchpad
for_window [title="^Steam - "] move scratchpad

# Lock down IPC for security (prevents external control)
# ipc {
#     socket disable
# }

### Focused window indicator
# Since there's no title bar, no visual indication needed
#
# Use `smart` (the default) rather than `focus`: when a window calls
# _NET_ACTIVE_WINDOW / xdg_activation, sway should only focus it if its
# workspace is already visible. With `focus`, an activation request from a
# scratchpad window pulls it back onto the visible workspace — this is how
# the preloaded Steam client occasionally surfaces during a `steam://rungameid`
# hand-off despite the `move scratchpad` rules below (the rules fire at map
# time; the activation request comes later, when for_window no longer runs).
focus_on_window_activation smart

### Mouse bindings - DISABLED
# No mouse bindings defined to prevent window manipulation

### Notes for production deployment:
# 1. Remove the emergency exit keybinding (Super+Shift+Escape)
# 2. Add kernel parameter: vt.handoff=0
# 3. Configure auto-login to this Sway session
# 4. Set up systemd to restart Sway if it crashes
# 5. Consider using a systemd user service for the launcher
# 6. Lock down sudo/root access
# 7. Disable virtual console switching in /etc/systemd/logind.conf:
#    NAutoVTs=0
#    ReserveVT=0
# 8. Consider running as a dedicated user account with limited permissions

# A YouTube playlist exposed as a browse-mode activity. shepherd-media
# fetches the playlist via yt-dlp at startup (cached for 6 hours under
# $XDG_CACHE_HOME/shepherd/media/playlists/) and shows each video as a
# poster tile. Replace the `list=` value with a playlist you control or
# trust. See docs/shepherd-media.md for caching behavior and the rationale
# for the recommended flags below.
#
# Recommended flags:
# - `--connectivity-check`: every source is a YouTube URL, so the grid is
#   unreachable when offline. The check empties the grid gracefully
#   instead of failing on the first click. Any reachable HTTPS or
#   `tcp://host:port` probe works.
# - `--reverse`: a channel's "uploads" playlist (`UU…`) is returned
#   newest-first by YouTube; reversing yields chronological viewing.
#   Omit for hand-curated `PL…` playlists where the owner's order is
#   already what you want.
[[entries]]
id = "youtube-channel"
label = "Family YouTube Channel"
icon = "folder-videos"

[entries.kind]
type = "process"
command = "shepherd-media"
args = [
    "browse",
    "--library", "https://www.youtube.com/playlist?list=PLREPLACE_WITH_YOUR_PLAYLIST_ID",
    "--connectivity-check", "https://connectivitycheck.gstatic.com/generate_204",
    "--reverse",
]

[entries.availability]

[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[[entries.availability.windows]]
days = "weekends"
start = "10:00"
end = "20:00"

# Terminal for debugging only.
# `foot` is used here (not `ptyxis`, `gnome-terminal`, etc.) because
# single-instance GApplication terminals D-Bus-delegate new windows to a
# long-lived primary that lives outside shepherdd's transient scope --
# the [entries.firewall] block below would silently be a no-op. See the
# "Firewall caveats" section in crates/shepherd-config/README.md.
[[entries]]
id = "terminal"
label = "Terminal"
icon = "utilities-terminal"
disabled = true  # Typically disabled, since it's:
disabled_reason = "For debugging only"

[entries.kind]
type = "process"
command = "foot"

[entries.availability]
always = true

[entries.firewall]
default = "deny"  # "deny" (default) blocks all unmatched traffic; "allow" permits all
allow = [
    "127.0.0.0/8",
    "::1/128",
]
deny = []

id = "steam-a-short-hike"
label = "A Short Hike"
group = "attention-heavy"  # Shares the "Games" budget with Celeste
# icon is autodetected from Steam's generated .desktop file, or falls back to "steam_icon_1055540"
# icon = "~/Games/Icons/A_Short_Hike.png"  # Override with a custom image if preferred

[entries.kind]
type = "steam"
app_id = 1055540  # Steam App ID

[entries.availability]
[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[[entries.availability.windows]]
days = "weekends"
start = "10:00"
end = "20:00"

# World of Goo (original) via Steam.
# Some games — notably the Tomorrow Corporation / 2D Boy titles below —
# don't process Wayland touch events but otherwise work great on a
# touchscreen. Setting `input_compat = "touch_to_mouse"` runs a sidecar
# that grabs touchscreens and synthesizes mouse events for the duration of
# the activity. `input_compat` also accepts a list, so touch and gamepad
# bridges can be stacked on a handheld with both. Requires the user
# running shepherdd to be in the `input` group; see docs/INSTALL.md.
#
# The inverse, `input_compat = "tablet_to_touch"`, grabs an absolute pointer
# or tablet and synthesizes touch events instead — for activities that only
# handle touch, when developing touch support on mouse/pen-only hardware, or
# in a VM whose pointer is an absolute tablet (QEMU/SPICE). It cannot be
# combined with `touch_to_mouse` (they invert each other).
#
# A third option, `input_compat = "disable_touch"`, grabs every touchscreen
# and discards its events for the duration of the activity — useful for games
# that misbehave on touch input but are still playable with a mouse or gamepad.
# It emits nothing (so it needs the `input` group but not `/dev/uinput`) and,
# like the two modes above, is mutually exclusive with them (all three grab or
# produce the touchscreen). It still stacks with a `gamepad_*` preset.
#
# Leave `input_compat` out entirely and the entry's kind decides. Only `ebook`
# asks for anything: it runs `gamepad_productivity`, whose D-pad is the arrow
# keys, so a pad turns pages with nothing configured. Writing the field here
# replaces that wholesale, and `input_compat = []` refuses every sidecar.
# https://store.steampowered.com/app/22000/World_of_Goo/
[[entries]]
id = "steam-world-of-goo"
label = "World of Goo"
input_compat = "touch_to_mouse"

[entries.kind]
type = "steam"
app_id = 22000

[entries.availability]
always = true

# Example of stacking touch + gamepad compatibility on the same activity
# (useful on a gaming handheld). The `gamepad_productivity` preset is best
# for non-first-person / point-and-click apps; `gamepad_gpd` is the GPD-style
# FPS mapping (left stick = WASD, right stick = mouse). The
# `[entries.input_compat_options]` block tunes the gamepad sidecar; all
# fields are optional and the sidecar applies sensible defaults if absent.
#
# [[entries]]
# id = "example-handheld"
# label = "Example handheld activity"
# input_compat = ["touch_to_mouse", "gamepad_productivity"]
#
# [entries.input_compat_options]
# gamepad_deadzone = 0.15        # 0..1 fraction of full stick deflection
# gamepad_mouse_speed = 800.0    # pixels/sec at full deflection
# gamepad_scroll_speed = 10.0    # wheel notches/sec at full deflection
#
# [entries.kind]
# type = "process"
# command = "/usr/bin/example"

# `requires_input` gates an activity on a class of physical input device being
# connected (issue #96). The activity is hidden from the launcher — and cannot
# be launched — whenever any listed device type is absent, and reappears as soon
# as it is plugged in. This is different from `input_compat` above: that one
# *translates* input while an activity runs, whereas `requires_input` decides
# *whether the activity is shown at all*.
#
# The classic use is a typing tutor installed on a gaming handheld that should
# only appear once a real keyboard is attached:
#
# [[entries]]
# id = "typing-tutor"
# label = "Learn to Type"
# requires_input = "keyboard"        # or a list: ["keyboard", "mouse"]
#
# [entries.kind]
# type = "process"
# command = "/usr/bin/tuxtype"
#
# Supported device types: "mouse", "touch", "keyboard", "gamepad". (Camera,
# microphone, and MIDI are planned but not yet supported.) A list requires ALL
# of the named types to be connected. Detecting devices reads /dev/input, so the
# user running shepherdd must be in the `input` group (see docs/INSTALL.md) —
# the same requirement as the `input_compat` bridges. If detection can't run,
# the gate fails open (the activity stays visible) rather than hiding it.

# `xwayland_native_resolution = true` is a workaround for issue #45: sway
# does not pass output scaling to XWayland clients, so an XWayland game on
# a panel configured with `output * scale 1.5` only renders at 1280x720 of
# a 1920x1080 panel and sway upscales the result (blurry). When this flag
# is set, shepherdd drops sway's compositor scale to 1.0 for the duration
# of the activity so the client sees the panel's native pixel grid; the
# HUD compensates with a counter-scale so it stays a normal physical size.
# Restored on exit.
#
# Only useful for XWayland activities on a HiDPI-scaled display. Native
# Wayland apps already get the panel's native pixel grid and should leave
# this `false` (the default).
#
# [[entries]]
# id = "example-xwayland-game"
# label = "Example XWayland Game"
# xwayland_native_resolution = true
#
# [entries.kind]
# type = "process"
# command = "/usr/bin/example-game"

# `confirm_on_close` controls whether the HUD asks for confirmation before its
# "X" (End session) button ends this activity (issue #78). Many activities lose
# unsaved state when force-closed and the button is easy to hit by accident, so
# this is `true` by default: the HUD shows a "really end?" prompt and only stops
# the activity once confirmed. Set it to `false` for activities that are safe to
# close instantly (e.g. a simple menu or a stateless viewer).
#
# Left unset, the default comes from the entry's kind. Only `ebook` differs: a
# book has nothing to lose, since the page is written on the way out, so it
# closes on one tap. Setting the field explicitly always wins.
#
# This only affects the HUD "X" button. Closing via the API, a time/quota
# expiration, or the activity's own process exiting is never gated by it.
#
# [[entries]]
# id = "example-safe-to-close"
# label = "Example (no close confirmation)"
# confirm_on_close = false
#
# [entries.kind]
# type = "process"
# command = "/usr/bin/example"

# `hud_orientation` puts the HUD on a different screen edge while this activity
# runs (issue #171). Accepts "top", "bottom" or "left"; left is the vertical
# HUD -- the same bar rotated a quarter turn, with the end-session button at
# the top, the sliders vertical, the activity name read bottom-to-top and the
# wall clock as an analog face.
#
# Use it for an activity whose own UI lives along the top of the screen, or one
# that wants every horizontal pixel it can get. Left unset, the activity uses
# the device-wide `[service.hud] orientation` (default "top"). Unlike
# `confirm_on_close` this has no per-kind default: which edge suits an activity
# depends on its own layout and on the panel, not on how it is launched.
#
# The HUD moves when the activity starts and moves back when it ends, so the
# launcher is always on the device's configured edge.
#
# [[entries]]
# id = "example-wide-game"
# label = "Example (side HUD)"
# hud_orientation = "left"
#
# [entries.kind]
# type = "process"
# command = "/usr/bin/example"

## === Flatpak-based applications ===
# Flatpak entries use the "flatpak" type for proper process management.
# Similar to Snap, Flatpak apps run in sandboxed environments and use
# systemd scopes for process management.

# Prism Launcher - Minecraft launcher (Flatpak)
# Install: flatpak install flathub org.prismlauncher.PrismLauncher
[[entries]]
id = "prism-launcher"
label = "Prism Launcher"
# icon is autodetected from the Flatpak app_id (no need to specify)

[entries.kind]
type = "flatpak"
app_id = "org.prismlauncher.PrismLauncher"

[entries.availability]
[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[[entries.availability.windows]]
days = "weekends"
start = "10:00"
end = "20:00"

[entries.internet]
required = true
check = "http://www.msftconnecttest.com/connecttest.txt"  # Use Microsoft's test URL (Minecraft is owned by Microsoft)
# forward_check = false
#   By default shepherdd also hands the resolved check (this one, else
#   `service.internet.check`) to the activity itself, for kinds that can act
#   on it — today `type = "media"`, whose browse grid hides items with no
#   local source while the check fails. Set false to launch without one.

[entries.limits]
max_run_seconds = 1800  # 30 minutes (roughly 3 in-game days)
daily_quota_seconds = 3600  # 1 hour per day
cooldown_seconds = 600  # 10 minute cooldown

[[entries.warnings]]
seconds_before = 600
severity = "info"
message = "10 minutes left - start wrapping up!"

[[entries.warnings]]
seconds_before = 120
severity = "warn"
message = "2 minutes remaining - save your game!"

[[entries.warnings]]
seconds_before = 30
severity = "critical"
message = "30 seconds! Save NOW!"

# Entry-specific volume restrictions (overrides global)
[entries.volume]
max_volume = 60  # Limit volume during gaming sessions

# Entry-specific brightness restrictions (overrides global). Same shape as
# [service.brightness]; you can dim the screen for bedtime activities by
# capping it here.
# [entries.brightness]
# max_brightness = 50

# Krita - digital painting (Flatpak)
# Install: flatpak install flathub org.kde.krita
[[entries]]
id = "krita"
label = "Krita"
# icon is autodetected from the Flatpak app_id (no need to specify)

[entries.kind]
type = "flatpak"
app_id = "org.kde.krita"

[entries.availability]
always = true

[entries.limits]
max_run_seconds = 0  # Unlimited
daily_quota_seconds = 0  # Unlimited
cooldown_seconds = 0  # No cooldown

## === Web browser ===
# A supervised web browser is a *composition*, not a dedicated entry kind:
#   1. kind = flatpak  -> the sandboxed com.google.Chrome from Flathub
#   2. [entries.browser] -> a Chromium managed-policy (URL allowlist + lockdown)
#                           plus the launch mode and on-disk profile
#   3. [entries.firewall] -> optional coarse IP-layer defense-in-depth
# shepherd-launcher only wraps Chrome through documented controls (enterprise
# policy JSON + command-line flags) -- it does not patch the browser or
# circumvent any protections.
#
# Install: flatpak install flathub com.google.Chrome
[[entries]]
id = "chrome-school"
label = "School"
# icon is autodetected from the Flatpak app_id (no need to specify)

[entries.kind]
type = "flatpak"
app_id = "com.google.Chrome"

[entries.browser]
# profile_id selects the on-disk user-data-dir. Entries that share a profile_id
# share cookies/logins; each unique id is isolated. Must be a single safe path
# segment (letters, digits, '-', '_', '.').
profile_id = "school"
# Window mode: "kiosk" and "app" both open a CHROMELESS window (no tabs or
# omnibox) that sway maximizes into the area around the time-remaining HUD;
# "windowed" is a normal browser window with tabs. shepherd's compositor keeps
# the HUD on top and intentionally denies apps true fullscreen, so neither mode
# takes over the whole display -- kiosk and app behave the same here.
mode = "kiosk"
start_url = "https://classroom.google.com"
# Hostname allowlisting is enforced by Chrome itself (no extensions needed).
# A non-empty allowlist is authoritative: everything not matched is blocked.
# Entries use Chrome's URL-filter format: "[scheme://]host[/path]". A plain
# hostname ALREADY matches all its subdomains (so "google.com" covers
# "classroom.google.com"). Do NOT write a "*." subdomain prefix or a trailing
# "/*": Chrome does not support a wildcard host and treats the path as a literal
# prefix, not a glob, so "https://*.google.com/*" matches nothing and the entry
# is blocked by the catch-all. See
# https://chromeenterprise.google/policies/url-blocking/ for the full format.
url_allowlist = [
    "https://google.com",
    "https://googleusercontent.com",
    "https://gstatic.com",
    "https://accounts.youtube.com",
]
# url_blocklist is applied after the allowlist (e.g. carve-outs within an
# allowed domain). Optional; defaults to empty.
url_blocklist = []
# Lockdown switches (all default to true):
disable_dev_tools = true
disable_incognito = true
disable_extensions = true
# wipe_on_exit clears the profile directory after the session ends (handled by
# shepherd, not Chrome). Use a unique profile_id with this; sharing a profile_id
# AND wiping deletes the shared profile. Defaults to false.
wipe_on_exit = false

# Optional coarse network firewall (issue #4), enforced via systemd's BPF
# address filter on the session's cgroup. This is IP-layer only -- hostnames
# are NOT resolved here, so the browser's url_allowlist above remains the
# authoritative host control. Left commented because a default-deny list needs
# the current Google/Workspace IP ranges, which drift over time; populate from
# https://www.gstatic.com/ipranges/goog.json (and the Microsoft equivalent for
# Microsoft 365) and uncomment to enable. As written below it would block all
# web traffic until real ranges are added.
# [entries.firewall]
# default = "deny"   # "deny" (default) or "allow"
# allow = [
#     "127.0.0.0/8",
#     "::1/128",
#     # ... add Google/Workspace CIDRs here ...
# ]
# deny = []

[entries.availability]
[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[entries.internet]
required = true
check = "https://www.gstatic.com/generate_204"

[entries.limits]
max_run_seconds = 3600       # 1 hour
daily_quota_seconds = 7200   # 2 hours per day

## === Media ===
# `shepherd-media` reads a declarative `.toml` library file and either
# direct-plays a single item or opens a poster-grid browser for a whole
# collection. See docs/shepherd-media.md for the schema and authoring guide.
# `shepherd-media validate <library.toml>` checks a file before you wire it
# up here.
#
# Entries use `type = "media"`: shepherdd builds the `shepherd-media` command
# line itself, so a bad item id or an unknown quality is caught by
# `shepherd-admin config validate` rather than on the child's screen.
#
# Most entries below reference `~/.config/shepherd/movies.toml`. A starter
# library that defines `big-buck-bunny`, `sintel`, `tears-of-steel`, and
# `lofi-beats` is checked in at `movies-library.example.toml`; copy it and
# update the `uri` paths to point at your own files:
#
#   cp movies-library.example.toml ~/.config/shepherd/movies.toml
#   $EDITOR ~/.config/shepherd/movies.toml
#   shepherd-media validate ~/.config/shepherd/movies.toml
#
# A YouTube playlist URL can be used in place of a library path; see the
# `youtube-channel` entry at the end of this section.

# "Big Buck Bunny" saved on local disk, registered as a single direct-play
# activity. The same library file can host many items; only one is exposed
# here.
# Available for free as CC BY 3.0 at https://peach.blender.org/download/
[[entries]]
id = "big-buck-bunny"
label = "Big Buck Bunny"
icon = "mpv"

[entries.kind]
type = "media"
library = "~/.config/shepherd/movies.toml"
mode = "play"
item = "big-buck-bunny"

[entries.availability]

[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[[entries.availability.windows]]
days = "weekends"
start = "10:00"
end = "20:00"

# A whole library exposed as a single browse-mode activity. The user picks
# items from a poster grid; each playback is internal to the process.
#
# Set `resume = true` to remember where each item was left off (and offer to
# continue the last one watched when the library re-opens). It is off by
# default: without it nothing about what was watched is written to disk.
# See docs/shepherd-media.md#resuming-playback.
[[entries]]
id = "movies-library"
label = "Movies"
icon = "folder-videos"

[entries.kind]
type = "media"
library = "~/.config/shepherd/movies.toml"
# mode = "browse"   # the default; opens the poster grid over the whole library
# resume = true
# quality = "1080p" # best | 1080p | 720p | 480p
# sort_by = "title" # library (default) | title | id | kind | category | duration
# reverse = true
# prefetch = false  # exclude just this library from background downloads

[entries.availability]

[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[[entries.availability.windows]]
days = "weekends"
start = "10:00"
end = "20:00"

# "lofi hip hop radio 📚 beats to relax/study to" streamed live from YouTube
[[entries]]
id = "lofi-beats"
label = "Lofi Beats"
icon = "mpv"

[entries.kind]
type = "media"
library = "~/.config/shepherd/movies.toml"
mode = "play"
item = "lofi-beats"
# A 24/7 live stream has no end to download; prefetching it would spend the
# whole cache on a file that never completes.
prefetch = false

[entries.availability]
always = true

[entries.limits]
max_run_seconds = 0  # Unlimited: sleep/study aid
daily_quota_seconds = 0  # Unlimited
cooldown_seconds = 0  # No cooldown

# A YouTube playlist exposed as a browse-mode activity. shepherd-media
# fetches the playlist via yt-dlp at startup (cached for 6 hours under
# $XDG_CACHE_HOME/shepherd/media/playlists/) and shows each video as a
# poster tile. Replace the `list=` value with a playlist you control or
# trust. See docs/shepherd-media.md for caching behavior and the rationale
# for the recommended flags below.
#
# Every source here is a YouTube URL, so the grid is unreachable when
# offline. shepherdd hands the activity the connectivity check from
# `[entries.internet]`, or `service.internet.check` above when the entry sets
# none — as here. Browse mode then polls it and empties the grid gracefully
# instead of failing on the first click. Set `forward_check = false` under
# `[entries.internet]` to launch without one.
#
# `reverse = true` is recommended for a channel's "uploads" playlist (`UU…`),
# which YouTube returns newest-first; reversing yields chronological viewing.
# Omit it for hand-curated `PL…` playlists where the owner's order is already
# what you want.
[[entries]]
id = "youtube-channel"
label = "Family YouTube Channel"
icon = "folder-videos"

[entries.kind]
type = "media"
library = "https://www.youtube.com/playlist?list=PLREPLACE_WITH_YOUR_PLAYLIST_ID"
reverse = true

[entries.availability]

[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[[entries.availability.windows]]
days = "weekends"
start = "10:00"
end = "20:00"

## === Emulated games (RetroArch) ===
# Install RetroArch and the cores you need with:
#   sudo shepherd-admin apps install retroarch mgba
#   shepherd-admin apps install retroarch help   # lists the available cores
#
# No games are included. Supply your own, and only ones you have the right to.
# See docs/emulators.md for the full picture: where saves live, how to back
# them up, and what the reset button does.
#
# Closing the activity writes a save state and opening restores it, so the
# child resumes exactly where they stopped -- mid-battle, mid-cutscene. That
# also means the game's own title screen becomes unreachable, which is what the
# HUD's reset button is for.

# Pokemon FireRed on the mGBA core (issue #125).
[[entries]]
id = "pokemon-firered"
label = "Pokemon FireRed"
# No `xwayland_native_resolution` here on purpose: RetroArch connects as a
# native Wayland client and renders at the panel's own pixel grid, fractional
# output scale included, so it does not need the XWayland workaround (see the
# troubleshooting section of docs/emulators.md, which shows how to check).
# Shares the "Games" schedule, short-burst cap, combined quota, and cooldown
# with the other members of this category (issue #5).
group = "attention-heavy"
# icon is autodetected from RetroArch's .desktop file; point it at box art to
# give the game its own tile.
# icon = "~/Games/Icons/pokemon-firered.png"

[entries.kind]
type = "retroarch"
# The core, named the way `shepherd-admin apps install retroarch` names it.
# Resolved to mgba_libretro.so in the usual libretro directories.
core = "mgba"
# Must be absolute or start with "~/": a bare relative path would resolve
# against the daemon's working directory, not yours.
content = "~/Games/retroarch/pokemon-firered.gba"
# save_state = "auto"   # the default; "off" boots the game fresh every time
# reset = true          # the default; false hides the HUD's reset button
# kiosk = true          # the default; locks RetroArch's own menu

[entries.limits]
max_run_seconds = 2700     # 45 minutes -- long enough to reach a save point
daily_quota_seconds = 5400
cooldown_seconds = 1800

## === Reading (ebook) ===
# Install the reader with:
#   sudo shepherd-admin apps install okular
#
# One activity per book, opening where the child stopped. shepherd generates
# the reader's whole configuration per entry -- the restrictions that keep the
# activity inside the book, the page-at-a-time view, the reading font -- and
# re-renders it before every launch, so nothing below needs a config file of
# its own. See docs/ebooks.md.
#
# No books are included. Supply your own, DRM-free. A book from a store belongs
# in that store's app -- a browser activity for Kindle Cloud Reader or Google
# Play Books -- because the DRM is the point of the store, and shepherd is not
# in the business of removing it.
[[entries]]
id = "the-hobbit"
label = "The Hobbit"
# The cover makes a far better tile than a generic book icon; without one,
# shepherd falls back to the format's mime icon.
# icon = "~/Books/covers/the-hobbit.png"

[entries.kind]
type = "ebook"
# Absolute or ~/-prefixed, like a RetroArch `content`: a bare relative path
# would resolve against the daemon's working directory, not yours.
book = "~/Books/the-hobbit.epub"
# layout = "facing_first_centered"
#                       # the default: two pages like an open book, with the
#                       # cover on its own so every later spread falls where a
#                       # printed book's would. "facing" pairs from the first
#                       # page instead; "single" suits a portrait screen, where
#                       # one page fills it; and "scroll" is a continuous
#                       # column -- the only layout a finger can navigate
#                       # unaided, since paging is bound to keys and the wheel
#                       # and the reader has no swipe gesture. The HUD grows a
#                       # pair of page-turn buttons for a reading activity, so
#                       # a paged layout is usable on a tablet too.
# font_size = 16        # points, for a reflowed EPUB. This is the reading-size
#                       # knob: the page is fitted to the screen, so a larger
#                       # font means fewer words on it and bigger text. It also
#                       # repaginates the book, which moves a saved place --
#                       # so choose it before the first read, not after.
# font_family = "Noto Serif"
# open_at = 1           # first launch only; after that the reader reopens
#                       # wherever the child stopped.
# kiosk = true          # the default; false unlocks the reader's own menus,
#                       # file dialog and settings -- for an admin looking at
#                       # what the reader does unrestricted, not for a child.

# Closing a book does not ask "are you sure": there is nothing to lose, since
# the page is written on the way out. That is this kind's default -- set
# confirm_on_close = true here to get the prompt anyway.

# A book also runs the `gamepad_productivity` sidecar by default, so a game
# controller's D-pad turns pages -- the reader itself understands keys, the
# wheel and nothing else. Set input_compat = [] to go without it.

# Reading is the obvious thing to reward, so no limit here -- and see the
# [entries.tokens] block on a game entry for banking reading time into it.
[entries.availability]
always = true

# A book needs no network. Belt to the reader's own restrictions: this is what
# stops a link inside a book reaching anything.
[entries.firewall]
default = "deny"

# Terminal for debugging only.
# `foot` is used here (not `ptyxis`, `gnome-terminal`, etc.) because
# single-instance GApplication terminals D-Bus-delegate new windows to a
# long-lived primary that lives outside shepherdd's transient scope --
# the [entries.firewall] block below would silently be a no-op. See the
# "Firewall caveats" section in crates/shepherd-config/README.md.
[[entries]]
id = "terminal"
label = "Terminal"
icon = "utilities-terminal"
disabled = true  # Typically disabled, since it's:
disabled_reason = "For debugging only"

[entries.kind]
type = "process"
command = "foot"

[entries.availability]
always = true

[entries.firewall]
default = "deny"  # "deny" (default) blocks all unmatched traffic; "allow" permits all
allow = [
    "127.0.0.0/8",
    "::1/128",
]
deny = []

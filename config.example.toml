# Sample shepherdd configuration
# This file defines the policy for what applications can run and when

config_version = 1

[service]
# Uncomment to customize paths (defaults use XDG directories for user-writable access)
# socket_path defaults to $XDG_RUNTIME_DIR/shepherdd/shepherdd.sock
# log_dir defaults to $XDG_STATE_HOME/shepherdd or ~/.local/state/shepherdd
# data_dir defaults to $XDG_DATA_HOME/shepherdd or ~/.local/share/shepherdd
# socket_path = "/run/user/1000/shepherdd/shepherdd.sock"
# log_dir = "~/.local/state/shepherdd"
# data_dir = "~/.local/share/shepherdd"

# Capture stdout/stderr from child applications to log files
# Logs are written to child_log_dir (or log_dir/sessions if not set)
# File format: <entry_id>_<timestamp>.log
# capture_child_output = true
# child_log_dir = "~/.local/state/shepherdd/sessions"

# Default max run duration if not specified per entry (1 hour)
# Set to 0 for unlimited (no time limit)
default_max_run_seconds = 3600

# How long a session has to last before it starts a cooldown (default 120).
# A workaround for unstable activities: one that crashes seconds after launch
# would otherwise start its cooldown and lock the child out of something they
# never got to play. Set to 0 to always start the cooldown; override per entry
# or per group with `limits.cooldown_min_session_seconds`.
# cooldown_min_session_seconds = 120

# How long a running activity gets to save its progress when the device wakes
# from sleep after the activity's hours have passed (default 120).
#
# The session clock is monotonic, so sleeping never spends a child's time — but
# it does carry a session past the wall-clock window that bounded it, and an
# overnight sleep would otherwise leave a bedtime activity running the next
# morning. On waking outside its hours the session is clamped to this long, with
# a warning, rather than being cut off mid-sentence.
#
# Set to 0 to close the activity as soon as the device wakes. Cascades: an
# entry's own `limits.save_grace_seconds`, else its group's, else this.
# save_grace_seconds = 120

# Global volume restrictions (optional)
# These apply when no entry-specific restrictions are defined.
#
# Per-device limits (e.g. a lower cap for headphones than for speakers) are NOT
# configured here. Devices identify themselves in ways that cannot be predicted
# from a config file, so shepherdd records each audio output it sees and you set
# a limit on it from the admin web UI ("Volume limits per device"). Plug the
# device in once and it appears in that list.
#
# The strictest limit always wins: a per-device limit can lower the caps below,
# never raise them.
[service.volume]
max_volume = 80      # Maximum volume percentage (0-100)
# min_volume = 20    # Minimum volume percentage (0-100)
allow_mute = true    # Whether mute toggle is allowed
allow_change = true  # Whether volume changes are allowed at all

# Global screen-brightness restrictions (optional)
# Applied when the host exposes a backlight under /sys/class/backlight
# (typically a laptop or convertible). The HUD hides its brightness slider
# entirely on hosts without a backlight, so these settings are no-ops on
# most desktops. Set `min_brightness` to keep children from driving the
# panel all the way to 0% (which most panels interpret as "off").
[service.brightness]
# max_brightness = 100   # Maximum brightness percentage (0-100)
min_brightness = 10      # Don't let brightness drop below 10%
allow_change = true      # Whether brightness changes are allowed at all

# Automatic (ambient-light) brightness (optional).
# When the host exposes an ambient light sensor (an IIO illuminance channel,
# e.g. /sys/bus/iio/devices/iio:deviceN/in_illuminance_raw), shepherdd can
# drive the backlight from measured room light. The screen sits at
# `min_percent` at/below `dim_lux` and at `max_percent` at/above `bright_lux`,
# interpolated logarithmically in between. The result is still clamped by the
# `min_brightness`/`max_brightness` restrictions above (and any per-entry
# override), so a bedtime activity's cap still applies. A manual slider drag
# temporarily wins and auto resumes once the room light shifts noticeably.
# `enabled` is only the default; the on/off state is toggleable from the HUD
# and management API and is persisted across restarts.
[service.brightness.auto]
enabled = false             # Start with auto brightness on?
# dim_lux = 10.0            # Lux at/below which the screen is dimmest
# bright_lux = 1000.0       # Lux at/above which the screen is brightest
# min_percent = 15          # Brightness at the dim end (0-100)
# max_percent = 100         # Brightness at the bright end (0-100)
# poll_interval_seconds = 3 # How often to sample the sensor

# External monitor / docking (optional, issue #87)
# When a handheld or laptop is docked to an external monitor or TV, shepherdd
# mirrors the primary panel onto it by default (via `wl-mirror`) and offers a
# HUD toggle to switch to "external only" at the TV's native resolution. Exactly
# one logical output is ever active, so the one-activity-at-a-time rule holds.
# Requires the `wl-mirror` runtime dependency for mirroring.
[service.display]
docking_enabled = true   # Master switch for external-monitor support
mirror_audio = true      # Route audio to the external video device while docked

# Internet connectivity check (optional)
# Entries can require internet and will be hidden when offline.
# Supported schemes: https://, http://, tcp://
[service.internet]
check = "https://connectivitycheck.gstatic.com/generate_204"
interval_seconds = 300  # Keep this high to avoid excessive network requests
timeout_ms = 1500

# Background media prefetch (optional) — issue #127
# shepherdd downloads the remote items of `type = "media"` libraries ahead of
# time, so a video the child opens later plays from disk instead of buffering,
# and the library keeps working offline. Downloads pause while an activity is
# running and while the internet is down, and a speculative download will never
# displace a video watched within `watched_grace_days`.
#
# See docs/shepherd-media.md for the cache's eviction policy.
[service.media]
# prefetch = true                        # global off switch
# prefetch_while_session_active = false  # true spends CPU/bandwidth during play
# free_space_floor_bytes = 2147483648    # 2 GiB; stop and warn below this. 0 disables
# cache_max_bytes = 10737418240          # 10 GiB; total size of the video cache
#
# How long watching a video protects its cached copy from being displaced by a
# speculative download. Inside the window a guess can never cost the child
# something they chose; past it the file competes on age like anything else, so
# a film watched once last spring eventually yields to a video added this week
# — which is also what keeps a full cache from freezing on old content. Raise it
# for a household that goes offline for long stretches; 0 removes the protection
# and orders purely by age.
# watched_grace_days = 30
#
# Skip sponsored spans in YouTube videos, from the SponsorBlock database
# (optional) — issue #159. Off by default: it is the one media feature that
# talks to a service outside your home, so nothing is looked up until you say
# so. Turn it on and a sponsor read, an "like and subscribe", or an end card is
# jumped over, with a brief notice saying why the video moved.
#
# What leaves the device when it is on: a four-character hash prefix, and
# nothing else. The lookup asks for every video whose id hashes into the same
# bucket — about a hundred of them — and picks yours out here, so the service
# cannot tell which one is playing. Nothing is ever submitted or voted on.
#
# Segment data is CC BY-NC-SA 4.0, from https://sponsor.ajay.app.
# [service.media.sponsorblock]
# enabled = false
#
# Which categories to skip. The default covers the spans that are reliably not
# the video; `preview` (a recap of an earlier episode), `filler` and
# `music_offtopic` are left out because their submissions are judgement calls
# that can cut something a child wanted. The full list is: sponsor, selfpromo,
# interaction, intro, outro, preview, filler, music_offtopic, hook.
# categories = ["sponsor", "selfpromo", "interaction", "intro", "outro"]
#
# Point this at a mirror to keep the lookups inside your own infrastructure.
# api = "https://sponsor.ajay.app"
#
# A single library can opt out (or in) with `sponsorblock` under its
# `[entries.kind]` — for a channel whose sponsor reads are part of the show.

# `cache_max_bytes` bounds the cache; `free_space_floor_bytes` bounds the volume
# it sits on. Both are needed: a 10 GiB cache on a 16 GiB device fills the disk
# long before it fills the cache. shepherdd hands the cap to every media
# activity it launches, so the daemon filling the cache and the player trimming
# it agree on its size — which is why this is config and not only the
# SHEPHERD_MEDIA_VIDEO_CACHE_MAX_BYTES environment variable, which remains as a
# local debugging override.

# Steam-specific behaviour (optional)
# Steam can block a game launch behind an "interstitial" — a modal it shows
# between the launch request and the game starting (e.g. the offline "Unable to
# Sync" cloud warning, or a "connect a controller" advisory). These render
# inside Steam's hidden CEF UI, so on a kiosk the launch just hangs forever.
# shepherdd watches Steam's loopback CEF remote-debugging endpoint and clicks the
# affirmative button for the interstitials you list here. Only listed kinds are
# dismissed; an empty list disables the feature and the debug port is never
# opened. When this key is omitted, the safe default set below is used.
#   cloud_sync             - "Unable to Sync" offline save warning (Play anyway)
#   controller_recommended - "connect a controller" advisory (OK)
#   steam_input_intro      - first-launch Steam Input intro (OK)
#   controller_required    - game REQUIRES a controller   (risky)
#   vr_required            - game REQUIRES a VR headset    (risky)
# "Risky" kinds launch a game that can't be used without the missing hardware;
# listing one requires allow_risky_dismiss = true. To instead keep a game from
# running at all in some condition, mark its entry `internet.required` (hidden
# when offline). If a blocker can't be (or isn't allowed to be) dismissed, the
# launch stalls out and ends with an error rather than surfacing the Steam window.
[service.steam]
auto_dismiss_interstitials = ["cloud_sync", "controller_recommended"]
allow_risky_dismiss = false
launch_timeout_seconds = 30

# HTTP management API (optional)
# Exposes a REST API for remote control, usage analytics, and daily overrides.
# Intended for local/LAN use (e.g. a parent's phone on the same network).
# WARNING: Do not expose this port to the internet without additional firewalling.
[service.management_api]
enabled = true
port = 8080                  # TCP port to listen on
bind = "0.0.0.0"             # Bind address ("127.0.0.1" for localhost-only)
# bind_retry_seconds = 300   # Retry initial bind for this long if the address is not yet
                             # assigned (e.g. ZeroTier interface still coming up at login).
                             # 0 = retry forever. Default: 300.
# auth_token = "changeme"    # Optional Bearer token; omit to allow unauthenticated access

# Bluetooth LE management transport (optional)
# Primary admin path: works without network configuration, IP autodiscovery,
# or a known static IP. Pairing uses Numeric Comparison (6-digit code shown
# on the TV); the first phone to pair becomes the admin (TOFU). Requires a
# working BlueZ adapter and the `bluez` system package.
[service.ble_management]
enabled = true
# device_name = "shepherd"              # Advertised local name. Pick something
                                        # the companion app can disambiguate
                                        # when multiple devices are in range.
# adapter = "DC:56:7B:1F:7D:EA"         # Which controller to serve on, when the
                                        # host has more than one. Default: the
                                        # first one BlueZ lists.
                                        #
                                        # Use the controller *address*, not the
                                        # hciN name: the index tracks USB probe
                                        # order, so re-plugging a dongle or a
                                        # differently-enumerated boot renumbers
                                        # the adapters and a config pinned to
                                        # "hci1" quietly follows the number onto
                                        # the other radio. `bluetoothctl list`
                                        # prints the addresses. An adapter that
                                        # isn't present is a startup error
                                        # listing the ones that are, rather than
                                        # a silent fallback.

# HUD placement (issue #171). "top" (the default) and "bottom" give the
# horizontal bar; "left" gives the vertical one -- the same HUD rotated a
# quarter turn down the left edge, for a tall panel or any device where a side
# strip costs less of the screen than a top bar.
#
# This is the device-wide default. An individual activity can override it with
# `hud_orientation` on its entry (see the example further down), and the HUD
# moves back to this edge when that activity ends.
#
# [service.hud]
# orientation = "left"

# Default warning thresholds
[[service.default_warnings]]
seconds_before = 300
severity = "info"
message = "5 minutes remaining"

[[service.default_warnings]]
seconds_before = 60
severity = "warn"
message = "1 minute remaining!"

[[service.default_warnings]]
seconds_before = 10
severity = "critical"
message = "10 seconds remaining!"

# -----------------------------------------------------------------------------
# Groups (issue #5)
# -----------------------------------------------------------------------------
# A group lets a category of activities share one schedule and one budget.
# Entries join with `group = "<id>"`. The group's limits apply *on top of* each
# member's own, and the stricter of the two wins.
#
# The daily quota is the key part: it is the COMBINED usage of every member, so
# one game can spend the whole category's budget, and when it runs out every
# member disappears at once.

[[groups]]
id = "attention-heavy"
label = "Games"

# One schedule for the whole category, instead of repeating identical
# `[entries.availability]` blocks on each member.
[groups.availability]
[[groups.availability.windows]]
days = "weekdays"
start = "16:00"
end = "18:00"

[[groups.availability.windows]]
days = "weekends"
start = "10:00"
end = "18:00"

[groups.limits]
# Per-session cap for any member — "short bursts" without repeating it per entry.
max_run_seconds = 900
# COMBINED daily total across every member (0 = unlimited).
daily_quota_seconds = 3600
# Any member's session starts this cooldown for the WHOLE category, so a child
# can't hop between games in it to dodge the wait.
cooldown_seconds = 600
# A member that crashes inside this many seconds doesn't cool down the category
# (defaults to service.cooldown_min_session_seconds).
# cooldown_min_session_seconds = 120

# A group can also be token-gated (issue #8): earning unlocks every member at
# once. Uncomment to require educational time before any of these appear.
# [groups.tokens]
# from = ["tuxmath", "gcompris"]
# earn_ratio = 0.5
# minimum_seconds = 600

# A caregiver can override a whole category for the day through the management
# API by passing `group:attention-heavy` as the override id — one call enables
# or disables every member.

# -----------------------------------------------------------------------------
# Entries
# -----------------------------------------------------------------------------


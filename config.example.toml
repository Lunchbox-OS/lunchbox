# Sample shepherdd configuration
# This file defines the policy for what applications can run and when

config_version = 1

[service]
# Uncomment to customize paths (defaults use XDG directories for user-writable access)
# socket_path defaults to $XDG_RUNTIME_DIR/shepherdd/shepherdd.sock
# log_dir defaults to $XDG_STATE_HOME/shepherdd or ~/.local/state/shepherdd
# data_dir defaults to $XDG_DATA_HOME/shepherdd or ~/.local/share/shepherdd
# socket_path = "/run/user/1000/shepherdd/shepherdd.sock"
# log_dir = "~/.local/state/shepherdd"
# data_dir = "~/.local/share/shepherdd"

# Capture stdout/stderr from child applications to log files
# Logs are written to child_log_dir (or log_dir/sessions if not set)
# File format: <entry_id>_<timestamp>.log
# capture_child_output = true
# child_log_dir = "~/.local/state/shepherdd/sessions"

# Default max run duration if not specified per entry (1 hour)
# Set to 0 for unlimited (no time limit)
default_max_run_seconds = 3600

# Global volume restrictions (optional)
# These apply when no entry-specific restrictions are defined
[service.volume]
max_volume = 80      # Maximum volume percentage (0-100)
# min_volume = 20    # Minimum volume percentage (0-100)
allow_mute = true    # Whether mute toggle is allowed
allow_change = true  # Whether volume changes are allowed at all

# Global screen-brightness restrictions (optional)
# Applied when the host exposes a backlight under /sys/class/backlight
# (typically a laptop or convertible). The HUD hides its brightness slider
# entirely on hosts without a backlight, so these settings are no-ops on
# most desktops. Set `min_brightness` to keep children from driving the
# panel all the way to 0% (which most panels interpret as "off").
[service.brightness]
# max_brightness = 100   # Maximum brightness percentage (0-100)
min_brightness = 10      # Don't let brightness drop below 10%
allow_change = true      # Whether brightness changes are allowed at all

# Internet connectivity check (optional)
# Entries can require internet and will be hidden when offline.
# Supported schemes: https://, http://, tcp://
[service.internet]
check = "https://connectivitycheck.gstatic.com/generate_204"
interval_seconds = 300  # Keep this high to avoid excessive network requests
timeout_ms = 1500

# Steam-specific behaviour (optional)
# Steam can block a game launch behind an "interstitial" — a modal it shows
# between the launch request and the game starting (e.g. the offline "Unable to
# Sync" cloud warning, or a "connect a controller" advisory). These render
# inside Steam's hidden CEF UI, so on a kiosk the launch just hangs forever.
# shepherdd watches Steam's loopback CEF remote-debugging endpoint and clicks the
# affirmative button for the interstitials you list here. Only listed kinds are
# dismissed; an empty list disables the feature and the debug port is never
# opened. When this key is omitted, the safe default set below is used.
#   cloud_sync             - "Unable to Sync" offline save warning (Play anyway)
#   controller_recommended - "connect a controller" advisory (OK)
#   steam_input_intro      - first-launch Steam Input intro (OK)
#   controller_required    - game REQUIRES a controller   (risky)
#   vr_required            - game REQUIRES a VR headset    (risky)
# "Risky" kinds launch a game that can't be used without the missing hardware;
# listing one requires allow_risky_dismiss = true. To instead keep a game from
# running at all in some condition, mark its entry `internet.required` (hidden
# when offline). If a blocker can't be (or isn't allowed to be) dismissed, the
# launch stalls out and ends with an error rather than surfacing the Steam window.
[service.steam]
auto_dismiss_interstitials = ["cloud_sync", "controller_recommended"]
allow_risky_dismiss = false
launch_timeout_seconds = 30

# HTTP management API (optional)
# Exposes a REST API for remote control, usage analytics, and daily overrides.
# Intended for local/LAN use (e.g. a parent's phone on the same network).
# WARNING: Do not expose this port to the internet without additional firewalling.
[service.management_api]
enabled = true
port = 8080                  # TCP port to listen on
bind = "0.0.0.0"             # Bind address ("127.0.0.1" for localhost-only)
# bind_retry_seconds = 300   # Retry initial bind for this long if the address is not yet
                             # assigned (e.g. ZeroTier interface still coming up at login).
                             # 0 = retry forever. Default: 300.
# auth_token = "changeme"    # Optional Bearer token; omit to allow unauthenticated access

# Default warning thresholds
[[service.default_warnings]]
seconds_before = 300
severity = "info"
message = "5 minutes remaining"

[[service.default_warnings]]
seconds_before = 60
severity = "warn"
message = "1 minute remaining!"

[[service.default_warnings]]
seconds_before = 10
severity = "critical"
message = "10 seconds remaining!"


# World of Goo (original) via Steam.
# Some games — notably the Tomorrow Corporation / 2D Boy titles below —
# don't process Wayland touch events but otherwise work great on a
# touchscreen. Setting `input_compat = "touch_to_mouse"` runs a sidecar
# that grabs touchscreens and synthesizes mouse events for the duration of
# the activity. `input_compat` also accepts a list, so touch and gamepad
# bridges can be stacked on a handheld with both. Requires the user
# running shepherdd to be in the `input` group; see docs/INSTALL.md.
#
# The inverse, `input_compat = "tablet_to_touch"`, grabs an absolute pointer
# or tablet and synthesizes touch events instead — for activities that only
# handle touch, when developing touch support on mouse/pen-only hardware, or
# in a VM whose pointer is an absolute tablet (QEMU/SPICE). It cannot be
# combined with `touch_to_mouse` (they invert each other).
#
# A third option, `input_compat = "disable_touch"`, grabs every touchscreen
# and discards its events for the duration of the activity — useful for games
# that misbehave on touch input but are still playable with a mouse or gamepad.
# It emits nothing (so it needs the `input` group but not `/dev/uinput`) and,
# like the two modes above, is mutually exclusive with them (all three grab or
# produce the touchscreen). It still stacks with a `gamepad_*` preset.
# https://store.steampowered.com/app/22000/World_of_Goo/
[[entries]]
id = "steam-world-of-goo"
label = "World of Goo"
input_compat = "touch_to_mouse"

[entries.kind]
type = "steam"
app_id = 22000

[entries.availability]
always = true

# Example of stacking touch + gamepad compatibility on the same activity
# (useful on a gaming handheld). The `gamepad_productivity` preset is best
# for non-first-person / point-and-click apps; `gamepad_gpd` is the GPD-style
# FPS mapping (left stick = WASD, right stick = mouse). The
# `[entries.input_compat_options]` block tunes the gamepad sidecar; all
# fields are optional and the sidecar applies sensible defaults if absent.
#
# [[entries]]
# id = "example-handheld"
# label = "Example handheld activity"
# input_compat = ["touch_to_mouse", "gamepad_productivity"]
#
# [entries.input_compat_options]
# gamepad_deadzone = 0.15        # 0..1 fraction of full stick deflection
# gamepad_mouse_speed = 800.0    # pixels/sec at full deflection
# gamepad_scroll_speed = 10.0    # wheel notches/sec at full deflection
#
# [entries.kind]
# type = "process"
# command = "/usr/bin/example"

# `xwayland_native_resolution = true` is a workaround for issue #45: sway
# does not pass output scaling to XWayland clients, so an XWayland game on
# a panel configured with `output * scale 1.5` only renders at 1280x720 of
# a 1920x1080 panel and sway upscales the result (blurry). When this flag
# is set, shepherdd drops sway's compositor scale to 1.0 for the duration
# of the activity so the client sees the panel's native pixel grid; the
# HUD compensates with a counter-scale so it stays a normal physical size.
# Restored on exit.
#
# Only useful for XWayland activities on a HiDPI-scaled display. Native
# Wayland apps already get the panel's native pixel grid and should leave
# this `false` (the default).
#
# [[entries]]
# id = "example-xwayland-game"
# label = "Example XWayland Game"
# xwayland_native_resolution = true
#
# [entries.kind]
# type = "process"
# command = "/usr/bin/example-game"


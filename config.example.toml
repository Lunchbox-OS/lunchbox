## === Media ===
# `shepherd-media` reads a declarative `.toml` library file and either
# direct-plays a single item or opens a poster-grid browser for a whole
# collection. See docs/shepherd-media.md for the schema and authoring guide.
# `shepherd-media validate <library.toml>` checks a file before you wire it
# up here.
#
# Most entries below reference `~/.config/shepherd/movies.toml`. A starter
# library that defines `big-buck-bunny`, `sintel`, `tears-of-steel`, and
# `lofi-beats` is checked in at `movies-library.example.toml`; copy it and
# update the `uri` paths to point at your own files:
#
#   cp movies-library.example.toml ~/.config/shepherd/movies.toml
#   $EDITOR ~/.config/shepherd/movies.toml
#   shepherd-media validate ~/.config/shepherd/movies.toml
#
# A YouTube playlist URL can be used in place of a library path; see the
# `youtube-channel` entry at the end of this section.

# "Big Buck Bunny" saved on local disk, registered as a single direct-play
# activity. The same library file can host many items; only one is exposed
# here.
# Available for free as CC BY 3.0 at https://peach.blender.org/download/
[[entries]]
id = "big-buck-bunny"
label = "Big Buck Bunny"
icon = "mpv"

[entries.kind]
type = "process"
command = "shepherd-media"
args = [
    "play",
    "--library", "~/.config/shepherd/movies.toml",
    "--item", "big-buck-bunny",
]

[entries.availability]

[[entries.availability.windows]]
days = "weekdays"
start = "15:00"
end = "18:00"

[[entries.availability.windows]]
days = "weekends"
start = "10:00"
end = "20:00"

